# panel-review and bot-review are declared in the adopter catalog the claude
# role installs from roles/claude/files/planwright/steps.yaml (polish is
# planwright's own). On a host without it an unattended run parks the unit and
# an attended one asks.
# bot-review pushes, so it belongs at post-pr and at no earlier point.
steps_convergence: [polish, panel-review]
steps_post_pr: [bot-review]
