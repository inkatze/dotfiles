[defaults]
retry_files_enabled = False
inventory = hosts
interpreter_python = auto_silent

# Gathered facts are reachable only as ansible_facts.<name>, not as top-level
# ansible_<name> vars. ansible-core has deprecated the injection and removes it
# in 2.24, and every run printed a DEPRECATION WARNING per referencing task.
# Setting it False now rather than waiting: with injection still on, a newly
# added `ansible_os_family` keeps working and silently reintroduces the problem,
# whereas here it fails immediately as an undefined variable. All references
# were converted in the same commit; the deliberate side effect is that the old
# spelling cannot come back unnoticed.
#
# Only *facts* are affected. Inventory and connection vars -- ansible_host,
# ansible_connection, ansible_become_exe in `hosts` -- are unrelated and keep
# their names.
inject_facts_as_vars = False
