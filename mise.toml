[tools]
lefthook = "2.0.4"
gitleaks = "8.30.0"
shellcheck = "0.11.0"
# The fourth linter lefthook's pre-commit hook runs, and the only one that was
# never pinned anywhere. It came from no host's tooling at all: the Brewfile
# does not carry it, apt is not asked for it, and the copy that exists on a Mac
# is vendored unlinked inside ansible-lint's libexec. So `mise run lint` and
# every commit touching a *.yml died with "yamllint: command not found" on a
# fresh checkout. CI never caught it because the workflow pip-installs its own.
yamllint = "1.38.0"

[tasks.lint]
description = "Run all linters (yamllint, ansible-lint, syntax-check)"
run = """
yamllint .
ansible-lint
ansible-playbook main.yml --syntax-check
"""

[tasks."hooks:install"]
description = "Install lefthook git hooks"
run = "lefthook install"

[tasks.install]
description = "Install everything (skip shell and upgrade)"
run = "./scripts/playbook.sh --skip-tags shell,upgrade"

[tasks.upgrade]
description = "Upgrade all packages and plugins"
run = "./scripts/playbook.sh -t upgrade"

[tasks.osx]
description = "Run OSX configuration"
run = "./scripts/playbook.sh -t osx"

# The Linux counterpart to `osx`, missing since the os_family role split added
# roles/linux. -K is baked in rather than left to the caller, following the
# `shell` task below: this role installs apt packages, writes an sshd_config.d
# drop-in, and regenerates the initrd, so it cannot do anything useful without
# a become password. Leaving it off just produced a confusing
# "sudo: a password is required" partway through.
[tasks.linux]
description = "Run Linux configuration (requires sudo)"
run = "./scripts/playbook.sh -t linux -K"

[tasks.ssh]
description = "Configure SSH"
run = "./scripts/playbook.sh -t ssh"

[tasks.tmux]
description = "Configure tmux"
run = "./scripts/playbook.sh -t tmux"

[tasks.fish]
description = "Configure fish shell"
run = "./scripts/playbook.sh -t fish"

[tasks.environments]
description = "Install language runtimes via mise"
run = "./scripts/playbook.sh -t environments"

[tasks.git]
description = "Configure git"
run = "./scripts/playbook.sh -t git"

[tasks.services]
description = "Provision the declared dev services (Linux) and macOS service config"
run = "./scripts/playbook.sh -t services"

[tasks.kitty]
description = "Configure kitty terminal"
run = "./scripts/playbook.sh -t kitty"

[tasks.shell]
description = "Change default shell (requires sudo)"
run = "./scripts/playbook.sh -t fish,shell -K"

[tasks.default]
description = "Install and upgrade everything"
run = "mise run install && mise run upgrade && mise run hooks:install"
