---

- name: Symlink gitconfig
  ansible.builtin.file:
    src: "{{ ansible_env.PWD }}/roles/git/files/gitconfig"
    dest: "{{ ansible_env.HOME }}/.gitconfig"
    state: link
    force: true
  tags: [git]

# The tracked gitconfig includes this file last, so it overrides the macOS
# signer path baked in above it. Written rather than symlinked because the
# value is host-resolved, not repo content.
- name: Write machine-local git overrides
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.gitconfig.local"
    mode: "0644"
    content: |
      # Managed by the dotfiles git role — do not edit by hand; the next
      # playbook run overwrites this file. Source: roles/git/defaults/main.yml.
      [gpg "ssh"]
          program = {{ git_onepassword_ssh_sign_path }}
  tags: [git]

- name: Symlink gitignore
  ansible.builtin.file:
    src: "{{ ansible_env.PWD }}/roles/git/files/gitignore"
    dest: "{{ ansible_env.HOME }}/.gitignore"
    state: link
    force: true
  tags: [git]
