---

- name: Symlink gitconfig
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/git/files/gitconfig"
    dest: "{{ ansible_facts.env.HOME }}/.gitconfig"
    state: link
    force: true
  tags: [git]

# Generated per host, never copied between machines. `creates` is what keeps
# this idempotent -- without it every run would mint a new key, changing the
# signing identity under GitHub and allowed_signers on every playbook run.
#
# -N '' (empty passphrase) is the entire point: a passphrase would reintroduce
# the interactive prompt this exists to remove.
- name: Generate the unattended commit-signing key
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N '' -C 'dotfiles unattended commit signing'
      -f {{ git_unattended_signing_key | quote }}
    creates: "{{ git_unattended_signing_key }}"
  when: git_signs_unattended | bool
  tags: [git]

# Guarded on existence rather than run unconditionally. ssh-keygen already
# writes 0600, so this exists only to correct a key that predates the role or
# got loosened -- and an unguarded `file` task fails outright when the path is
# absent, which is exactly the state a --check run leaves behind (the generate
# task above reports `changed` without creating anything). A dry run against a
# fresh host would fail here for no real reason.
# Same shape as the signing key above and idempotent for the same reason: without
# `creates` every run would mint a new key, and since the public half is
# registered on GitHub by hand, a regenerated key means pushes start failing with
# Permission denied until someone notices and re-registers it.
#
# -N '' for the same reason too. A passphrase reintroduces the interactive prompt
# this exists to remove.
- name: Generate the unattended GitHub authentication key
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N '' -C 'dotfiles unattended github auth'
      -f {{ git_unattended_auth_key | quote }}
    creates: "{{ git_unattended_auth_key }}"
  when: git_authenticates_unattended | bool
  tags: [git]

# AFTER both generate tasks, deliberately. Stat'ing before them reads the state
# of a file that is about to be created, so the guards below skip on the exact
# run that mints a key -- observed: the first real run generated the auth key and
# then skipped its own chmod. It went unnoticed because ssh-keygen already writes
# 0600, which is precisely what makes the ordering bug survive review.
- name: Check whether the key files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: git_key_stat
  loop:
    - "{{ git_unattended_signing_key }}"
    - "{{ git_unattended_auth_key }}"
  check_mode: false
  tags: [git]

- name: Restrict the signing key
  ansible.builtin.file:
    path: "{{ git_unattended_signing_key }}"
    mode: "0600"
  when:
    - git_signs_unattended | bool
    - git_key_stat.results[0].stat.exists
  tags: [git]

- name: Restrict the authentication key
  ansible.builtin.file:
    path: "{{ git_unattended_auth_key }}"
    mode: "0600"
  when:
    - git_authenticates_unattended | bool
    - git_key_stat.results[1].stat.exists
  tags: [git]

# Surfaced rather than left to be discovered by a failing push: the key is
# useless until its public half is registered on GitHub, and nothing in this
# playbook can do that (registering it needs an authenticated API call, which is
# the very thing being fixed).
- name: Report the public key that needs registering
  ansible.builtin.command:
    cmd: cat {{ (git_unattended_auth_key ~ '.pub') | quote }}
  register: git_auth_pubkey
  changed_when: false
  failed_when: false
  check_mode: false
  when: git_authenticates_unattended | bool
  tags: [git]

- name: Explain how to finish enabling unattended pushes
  ansible.builtin.debug:
    msg: >-
      Register this public key on GitHub as an AUTHENTICATION key (Settings,
      SSH and GPG keys, New SSH key, type Authentication), then switch the
      remote to SSH. Until both are done, pushes from this host still use
      HTTPS and the gh keyring. Key: {{ git_auth_pubkey.stdout | default('') }}
  when:
    - git_authenticates_unattended | bool
    - git_auth_pubkey.rc | default(1) == 0
  tags: [git]

# Resolved rather than hardcoded, because gh lives in a different place per
# platform (Homebrew on macOS, mise on Linux) and because the ABSOLUTE path is
# what makes the credential helper safe -- see the comment on it below.
# ansible.builtin.shell, not command: `command -v` is a shell builtin, so the
# command module cannot run it and the probe silently reports failure — which
# renders the credential helper block below into nothing at all.
- name: Resolve the gh binary
  ansible.builtin.shell:
    cmd: command -v gh
  register: git_gh_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [git]

# The tracked gitconfig includes this file last, so it overrides both the signer
# path and the signing key baked in above it. Written rather than symlinked
# because the values are host-resolved, not repo content.
- name: Write machine-local git overrides
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.gitconfig.local"
    mode: "0644"
    content: |
      # Managed by the dotfiles git role — do not edit by hand; the next
      # playbook run overwrites this file. Source: roles/git/defaults/main.yml.
      [gpg "ssh"]
          program = {{ git_signing_program }}
      {% if git_signs_unattended | bool %}
      # This host signs with its own on-disk key rather than through 1Password,
      # so it can commit with no GUI and no approval prompt. Overrides the
      # 1Password-held key named in the tracked gitconfig.
      [user]
          signingkey = {{ git_unattended_signing_key }}
      {% endif %}
      {% if git_authenticates_unattended | bool %}
      # SSH pushes offer this host's own on-disk key rather than reaching for an
      # agent that is not running on a headless boot. See
      # roles/git/defaults/main.yml for why the agent path fails here.
      #
      # IdentitiesOnly is deliberately NOT set. An agent, where one exists, is
      # still tried first; this only adds an identity rather than replacing the
      # set, so enabling a host that does have a working agent cannot break it.
      #
      # Only affects SSH remotes. An https:// remote ignores this entirely and
      # falls through to the credential helper below.
      [core]
          sshCommand = ssh -i {{ git_unattended_auth_key }}
      {% endif %}
      {% if git_gh_probe.rc == 0 %}
      # Credential helper for HTTPS remotes, and a fallback rather than the
      # unattended path it was once described as.
      #
      # CORRECTED 2026-07-30: this comment previously claimed the helper is
      # "what lets a headless host push with no GUI and no approval prompt".
      # It is not. gh keeps its token in the GNOME keyring, which an interactive
      # login unlocks and a headless boot does not, so after an unattended reboot
      # `gh auth token` returns empty and every push over HTTPS fails. Measured
      # on this host. Unattended pushing is handled by the SSH key above; this
      # helper covers attended sessions and HTTPS remotes.
      #
      # ABSOLUTE path, deliberately. git runs credential helpers through `sh`,
      # which does not necessarily carry mise's PATH, so a bare `gh` can resolve
      # to a different binary than the one on your shell's PATH — and on a host
      # with both an apt gh and a mise gh, the bare form silently picks the older
      # apt one. That is precisely the stale, credential-holding client that
      # roles/linux/files/mise/linux.toml moved to mise to avoid.
      #
      # Scoped to github.com because gh only speaks GitHub; other hosts fall
      # through to git's normal credential handling.
      [credential "https://github.com"]
          helper = !{{ git_gh_probe.stdout | trim }} auth git-credential
      {% endif %}
  tags: [git]

- name: Symlink gitignore
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/git/files/gitignore"
    dest: "{{ ansible_facts.env.HOME }}/.gitignore"
    state: link
    force: true
  tags: [git]
