hostname *
askpass ssh
share_connections yes

# Host-specific sections name a real machine, which this public repo keeps out
# of committed artifacts (linux-migration REQ-F1.1). They live in a
# machine-local file instead. `~/.config/kitty` is a symlink into this repo, so
# the file sits under `~/.config/dotfiles/` alongside the repo's other
# machine-local indirections (`host` for scripts/playbook.sh, `ssh-host` for
# the `sshc` function in roles/fish/files/fish/config.fish).
#
# Keep this directive LAST: kitty resolves a destination against the last
# matching `hostname` section, so an included block wins over the `hostname *`
# defaults above. Sections do not inherit from each other, so a machine-local
# block that needs `askpass`/`share_connections` must repeat them.
# `globinclude` is silent when the pattern matches nothing, so a host without
# the file is unaffected.
#
# Example `~/.config/dotfiles/kitty-ssh.conf`:
#
#   hostname my-laptop
#   env ANTHROPIC_API_KEY=_kitty_copy_env_var_
#   env TMUX=_kitty_copy_env_var_
globinclude ${HOME}/.config/dotfiles/kitty-ssh.conf
