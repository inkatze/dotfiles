---

# The role's pre-existing macOS-only content, unchanged in substance and now
# guarded to the platform it was always written for (specs/dev-services,
# REQ-B1.4). It ran everywhere before: the my.cnf task below carried no
# `when:` at all, so the Linux host got a ~/.my.cnf pointing at Homebrew paths
# for a MySQL it does not have. D-1 argued the guard is a correction the role
# needs regardless of the declared layer; this is that correction.
#
# The guard is on the block rather than on the import in main.yml so it
# travels with the file -- see the same note in linux.yml.
- name: Configure the macOS-only services
  when: ansible_facts.os_family == "Darwin"
  block:
    - name: Check what owns my.cnf
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.my.cnf"
        follow: false
      register: services_my_cnf
      tags: [services]

    # An earlier run of this role pointed ~/.my.cnf at the repo, and a client
    # password added there would land in a public checkout.
    - name: Replace a repo-owned my.cnf symlink with a real file
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.my.cnf"
        state: absent
      when:
        - services_my_cnf.stat.islnk | default(false)
        - services_my_cnf.stat.lnk_source | default('') is search('/roles/services/files/my\.cnf$')
      tags: [services]

    # blockinfile has no `follow` option, so it writes THROUGH a symlink. A
    # link this role does not own has to be skipped outright.
    - name: Apply the client defaults to my.cnf
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.env.HOME }}/.my.cnf"
        block: "{{ lookup('ansible.builtin.file', 'my.cnf') }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK (dotfiles)"
        create: true
        mode: "0600"
      when: >-
        not (services_my_cnf.stat.islnk | default(false))
        or services_my_cnf.stat.lnk_source | default('') is search('/roles/services/files/my\.cnf$')
      tags: [services]

    - name: Report a foreign my.cnf symlink left untouched
      ansible.builtin.debug:
        msg: >-
          ~/.my.cnf is a symlink to
          {{ services_my_cnf.stat.lnk_source | default('?') }}, which this role
          does not own, so the client defaults were not applied.
      when:
        - services_my_cnf.stat.islnk | default(false)
        - services_my_cnf.stat.lnk_source | default('') is not search('/roles/services/files/my\.cnf$')
      tags: [services]

    - name: Start colima service
      ansible.builtin.command:
        cmd: brew services start colima
      register: services_colima_result
      changed_when: "'Successfully started' in services_colima_result.stdout"
      failed_when: false
      when: inventory_hostname == 'personal'
      tags: [services, colima]

    - name: Wait for colima to be ready
      ansible.builtin.command:
        cmd: colima status
      register: services_colima_status
      until: services_colima_status.rc == 0
      retries: 30
      delay: 2
      when: inventory_hostname == 'personal'
      tags: [services, colima]

    # colima's default $HOME mount plus mountInotify:true runs a file-event relay
    # over the entire home directory, spawning adhoc-signed limactl ~1/sec. Each
    # spawn triggers a Gatekeeper assessment, flashing the "Verifying..." panel.
    # Disabling inotify propagation stops the churn. virtiofs already propagates
    # most file changes; only re-enable (scoped to a project dir via `mounts:`) if a
    # container needs in-VM inotify for hot-reload.
    - name: Check for colima config file
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.colima/default/colima.yaml"
      register: services_colima_config
      when: inventory_hostname == 'personal'
      tags: [services, colima]

    - name: Disable colima mountInotify to avoid Gatekeeper verify churn
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.env.HOME }}/.colima/default/colima.yaml"
        regexp: "^mountInotify:.*$"
        line: "mountInotify: false"
      register: services_colima_inotify
      when:
        - inventory_hostname == 'personal'
        - services_colima_config.stat.exists
      tags: [services, colima]

    # brew services restart is safe for colima (unlike ollama): colima's formula
    # service block is a bare `colima start -f` with no custom plist keys to lose on
    # regeneration. The restart makes `colima start` re-read the edited colima.yaml.
    - name: Restart colima to apply mountInotify change
      ansible.builtin.command:
        cmd: brew services restart colima
      register: services_colima_restart
      changed_when: "'Successfully' in services_colima_restart.stdout"
      when:
        - inventory_hostname == 'personal'
        - services_colima_inotify is changed
      tags: [services, colima]

    - name: Wait for colima to be ready after restart
      ansible.builtin.command:
        cmd: colima status
      register: services_colima_status_post
      until: services_colima_status_post.rc == 0
      retries: 30
      delay: 2
      changed_when: false
      when:
        - inventory_hostname == 'personal'
        - services_colima_inotify is changed
      tags: [services, colima]
