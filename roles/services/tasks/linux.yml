---

# The shared dev-services lifecycle (specs/dev-services, D-1 and D-5). Every
# task below reads the declaration in defaults/main.yml and names no service,
# which is the whole of REQ-B1.1: adding one is a declaration edit, not a
# control-flow edit.
#
# The guard sits on the block rather than on the import in main.yml so it
# travels with the file it guards -- importing this file on its own is still
# safe, which is what lets scripts/services-declaration-test.sh assert the
# guard by running it directly.
- name: Provision the declared dev services
  when: ansible_facts.os_family == "Debian"
  tags: [services]
  block:
    # TEMPORARY -- specs/dev-services Task 6 Done-when, REQ-E1.2. This task
    # reports `changed` on every run, so the convergence gate must fail the
    # second run. Reverted in the very next commit; it exists only so the gate
    # is observed failing rather than assumed to work. An idempotency gate that
    # has never been seen to go red is indistinguishable from one that cannot.
    - name: Deliberate non-idempotent task, reverted immediately
      ansible.builtin.file:
        path: /tmp/dev-services-idempotency-probe
        state: touch
        mode: "0644"

    - name: Install the declared dev-service packages
      ansible.builtin.apt:
        name: "{{ services_dev_services | map(attribute='package') | list }}"
        state: present
        update_cache: true
        # Two runs back to back are the convergence check (REQ-C1.1), and a
        # cache refresh reports changed. An hour's validity keeps the second
        # run clean without letting a stale list defer a first install.
        cache_valid_time: 3600
      become: true

    - name: Enable and start the declared dev services
      ansible.builtin.systemd_service:
        name: "{{ item.unit }}"
        enabled: true
        state: started
      become: true
      loop: "{{ services_dev_services }}"
      loop_control:
        label: "{{ item.name }}"

    # Not ceremony after the step above. A distribution meta unit can be a
    # oneshot whose ExecStart is /bin/true, which systemd reports active
    # whether or not anything is accepting connections; asserting the declared
    # address and port is what makes "started" mean something. It is also the
    # only step that checks the declaration against reality, so a wrong port
    # or a service that binds somewhere unexpected fails here (REQ-B1.1).
    - name: Verify the declared dev services are listening
      ansible.builtin.wait_for:
        host: "{{ item.listen_address }}"
        port: "{{ item.listen_port }}"
        timeout: 30
      loop: "{{ services_dev_services }}"
      loop_control:
        label: "{{ item.name }}"

    # Where the shared lifecycle stops and the per-service half begins (D-5,
    # REQ-B1.3). The four steps above generalise because they are identical
    # for every service; cluster initialisation and authentication posture are
    # not, so forcing them into the declaration would produce a schema that is
    # a union of unrelated fields. What the declaration carries instead is a
    # pointer, and this step follows it -- so the lifecycle still names no
    # service, and a service with bespoke setup is still added by declaring
    # it rather than by editing control flow (REQ-B1.1).
    #
    # Last, and not incidentally: the setup below connects to a server, so it
    # needs the verify step above to have already established there is one.
    #
    # `selectattr` rather than a `when:` on the include, so a service with no
    # bespoke setup contributes no task at all instead of a skipped one.
    # include_tasks, not import_tasks: the file to run comes from a variable,
    # which a static import cannot express. The tag inheritance that costs is
    # cheap here -- the enclosing block's `services` tag reaches the included
    # tasks, verified against ansible-core 2.21 rather than assumed, because
    # main.yml's note records how quietly this exact thing fails.
    - name: Apply the declared per-service setup
      ansible.builtin.include_tasks: "{{ item.setup }}"
      loop: "{{ services_dev_services | selectattr('setup', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
