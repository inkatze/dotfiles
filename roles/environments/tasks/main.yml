---

# Same unguarded `brew --prefix` as the fish role had, with the same
# tags: [always], so this was a second hard stop for any Linux run. Resolved
# independently here rather than reusing the fish role's fact: relying on
# role ordering would make this role silently depend on another having run.
- name: Get the Homebrew prefix (macOS only)
  ansible.builtin.command:
    cmd: brew --prefix
  register: environments_brew_prefix
  changed_when: false
  when: ansible_facts.os_family == "Darwin"
  tags: [always]

- name: Resolve the fish install prefix
  ansible.builtin.set_fact:
    environments_fish_prefix: >-
      {{ environments_brew_prefix.stdout
         if ansible_facts.os_family == 'Darwin'
         else '/usr' }}
  tags: [always]

# Global config, not ~/.config/mise.toml: mise finds that only by walking up
# from the cwd, so it is ignored outside $HOME and whenever project files are
# turned off. Global config needs no `mise trust`.
- name: Inspect the mise global config
  ansible.builtin.stat:
    path: "{{ environments_mise_global_config }}"
    follow: false
  register: environments_mise_global_config_stat
  check_mode: false
  tags: [environments]

# Suffix match, not equality: the link may name a different clone. config.toml
# is what this path was linked to before the asdf interlude.
- name: Classify the mise global config
  ansible.builtin.set_fact:
    environments_mise_global_config_owner: >-
      {{ 'none' if not environments_mise_global_config_stat.stat.exists else
         ('repo' if (environments_mise_global_config_stat.stat.islnk
                     and (environments_mise_global_config_stat.stat.lnk_target
                          is search('/roles/environments/files/(mise|config)[.]toml$')))
          else 'foreign') }}
  tags: [environments]

- name: Ensure the mise config directory exists
  ansible.builtin.file:
    path: "{{ environments_mise_global_config | dirname }}"
    state: directory
    mode: "0755"
  when: environments_mise_global_config_owner != 'foreign'
  tags: [environments]

- name: Symlink the mise global config
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/environments/files/mise.toml"
    dest: "{{ environments_mise_global_config }}"
    state: link
    force: true
  when: environments_mise_global_config_owner != 'foreign'
  tags: [environments]

- name: Report a mise global config left untouched
  ansible.builtin.debug:
    msg: >-
      {{ environments_mise_global_config }} is not this repo's link
      ({{ environments_mise_global_config_stat.stat.lnk_target | default('a real file') }}),
      so it was left alone and the global mise pins were not installed. Move its content into
      {{ environments_mise_global_config | dirname }}/conf.d/ and re-run.
  when: environments_mise_global_config_owner == 'foreign'
  tags: [environments]

- name: Inspect the retired mise config link
  ansible.builtin.stat:
    path: "{{ environments_mise_legacy_config }}"
    follow: false
  register: environments_mise_legacy_config_stat
  check_mode: false
  tags: [environments]

- name: Classify the retired mise config link
  ansible.builtin.set_fact:
    environments_mise_legacy_config_owner: >-
      {{ 'none' if not environments_mise_legacy_config_stat.stat.exists else
         ('repo' if (environments_mise_legacy_config_stat.stat.islnk
                     and (environments_mise_legacy_config_stat.stat.lnk_target
                          is search('/roles/environments/files/mise[.]toml$')))
          else 'foreign') }}
  tags: [environments]

# Only once the global config is ours, so a host whose global config is
# foreign keeps the pins it had.
- name: Remove the retired mise config link
  ansible.builtin.file:
    path: "{{ environments_mise_legacy_config }}"
    state: absent
  when:
    - environments_mise_legacy_config_owner == 'repo'
    - environments_mise_global_config_owner != 'foreign'
  tags: [environments]

- name: Report a foreign file at the retired mise config path
  ansible.builtin.debug:
    msg: >-
      {{ environments_mise_legacy_config }} is not this repo's link
      ({{ environments_mise_legacy_config_stat.stat.lnk_target | default('a real file') }}),
      so it was left alone. mise reads it as a project file of $HOME, ahead of the global config.
  when: environments_mise_legacy_config_owner == 'foreign'
  tags: [environments]

- name: Symlink default initial packages file
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/environments/files/{{ item.defaults }}"
    dest: "{{ ansible_facts.env.HOME }}/.{{ item.defaults }}"
    state: link
  with_items: "{{ environments_mise_tools }}"
  when: item.defaults is defined
  tags: [environments]

- name: Install mise plugins
  ansible.builtin.shell:
    cmd: mise plugins install {{ item.name }} {{ item.plugin }}
    executable: "{{ environments_fish_prefix }}/bin/fish"
  register: environments_mise_installation_result
  changed_when: "'already installed' not in environments_mise_installation_result.stdout"
  with_items: "{{ environments_mise_tools }}"
  when: item.plugin is defined
  tags: [environments]

- name: Import Node.js GPG keys
  ansible.builtin.shell:
    cmd: |
      gpg --keyserver hkps://keys.openpgp.org --recv-keys 4ED778F539E3634C779C87C6D7062848A1AB005C
      gpg --keyserver hkps://keys.openpgp.org --recv-keys 141F07595B7B3FFE74309A937405533BE57C7D57
      gpg --keyserver hkps://keys.openpgp.org --recv-keys 74F12602B6F1C4E913FAA37AD3A89613643B6201
      gpg --keyserver hkps://keys.openpgp.org --recv-keys DD792F5973C6DE52C432CBDAC77ABFA00DDBF2B7
      gpg --keyserver hkps://keys.openpgp.org --recv-keys 61FC681DFB92A079F1685E77973F295594EC4689
      gpg --keyserver hkps://keys.openpgp.org --recv-keys 8FCCA13FEF1D0C2E91008E09770F7A9A5AE15600
      gpg --keyserver hkps://keys.openpgp.org --recv-keys C4F0DFFF4E8C1A8236409D08E73BC641CC11F4C8
      gpg --keyserver hkps://keys.openpgp.org --recv-keys 890C08DB8579162FEE0DF9DB8BEAB4DFCF555EF4
      gpg --keyserver hkps://keys.openpgp.org --recv-keys C82FA3AE1CBEDC6BE46B9360C43CEC45C17AB93C
      gpg --keyserver hkps://keys.openpgp.org --recv-keys 108F52B48DB57BB0CC439B2997B01419BD92F80A
      gpg --keyserver hkps://keys.openpgp.org --recv-keys A363A499291CBBC940DD62E41F10027AF002F8B0
      gpg --keyserver hkps://keys.openpgp.org --recv-keys 86C8D74642E67846F8E120284DAA80D1E737BC9F
  register: environments_gpg_import_result
  changed_when: "'imported' in environments_gpg_import_result.stderr"
  failed_when: false
  tags: [environments]

# `mise install <tool>` is silent and exit-0 when the pinned version is already
# installed, so its output cannot distinguish a real install from a no-op. The
# `changed_when: "'already installed' not in ...stdout"` this replaces was
# inherited from the asdf era (asdf printed that string; mise never has) and
# survived the asdf->mise swap in ce31623 unexamined. Empty stdout does not
# contain the string, so the test was always true and this task reported
# `changed` on EVERY run -- verified by two consecutive runs on a fully
# converged host, the second of which still reported changed for all items.
# That permanently blocked the "a second run is changed=0" convergence check.
#
# Gate on mise's own answer instead: `mise ls --missing` lists only tool
# versions that are declared but not installed, so empty stdout means there is
# nothing to do.
- name: Find mise tool versions that are declared but not installed
  ansible.builtin.shell:
    cmd: mise ls --missing
    chdir: "{{ ansible_facts.env.HOME }}"
    executable: "{{ environments_fish_prefix }}/bin/fish"
  register: environments_mise_missing
  changed_when: false
  tags: [environments]

# Coarse on purpose: if anything at all is missing, every tool is passed to
# `mise install`. The already-present ones are silent no-ops (that is the same
# property that broke the old changed_when), so the cost is negligible and it
# avoids matching loop names against mise's output -- which would be wrong
# anyway, since this list says `nodejs` where mise reports `node`.
#
# chdir to $HOME on both tasks: mise layers config from the cwd upward, and
# Ansible runs from the repo root, so without it the check would also see this
# repo's own mise.toml (gitleaks, lefthook) and the role's idempotency would
# depend on which directory the playbook was invoked from.
- name: Install default tool versions
  ansible.builtin.shell:
    cmd: mise install {{ item.name }}
    chdir: "{{ ansible_facts.env.HOME }}"
    executable: "{{ environments_fish_prefix }}/bin/fish"
  with_items: "{{ environments_mise_tools }}"
  when: environments_mise_missing.stdout | length > 0
  changed_when: true
  tags: [environments]

- name: Update NodeJS config
  ansible.builtin.import_tasks: nodejs.yml
  tags: [environments]

- name: Reshim mise tools
  ansible.builtin.shell:
    cmd: mise reshim
    executable: "{{ environments_fish_prefix }}/bin/fish"
  changed_when: false
  tags: [environments, upgrade]
