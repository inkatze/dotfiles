---

- name: Symlink npmrc
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/environments/files/npmrc"
    dest: "{{ ansible_facts.env.HOME }}/.npmrc"
    state: link

- name: Symlink importjs.js
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/environments/files/importjs.js"
    dest: "{{ ansible_facts.env.HOME }}/.importjs.js"
    state: link
