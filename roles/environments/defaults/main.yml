---

environments_mise_tools:
  - {name: nodejs, defaults: default-npm-packages}
  - {name: ruby, defaults: default-gems}
  - {name: java}
  - {name: python, defaults: default-python-packages}
  - {name: erlang}
  - {name: elixir, defaults: default-mix-commands}
  - {name: terraform}
  # rust was declared in files/mise.toml but never added here, so the playbook
  # never installed it -- an oversight, not a decision: e2df83b ("Add rust
  # stable to default tooling") touched only mise.toml. It must be listed for
  # the `mise ls --missing` gate in tasks/main.yml to converge: an undeclared
  # but missing tool would keep the gate open forever without ever being
  # installed. lua carried the same note until the editor removal took its
  # last consumer; both sides of its declaration went together.
  - {name: rust}
  # Listed here as well as in files/mise.toml, for the reason the note above
  # records: mise.toml alone would leave `mise ls --missing` reporting usage on
  # every run while the install loop never reaches it, so the role could never
  # converge to changed=0.
  - {name: usage}
