[tools]
ruby = '3.4.2'
node = { version = "24", postinstall = "corepack enable" }
python = "3.13.3"
java = "microsoft-21.0.7"
erlang = "28.3"
elixir = "1.19.4-otp-28"
terraform = "1.14.8"
terraform-ls = '0.36.4'
lua = "5.1.5"
rust = "stable"

# Not a runtime, and the one entry here that another tool depends on rather than
# a person. `mise completion fish` emits a script generated by usage-cli whose
# first act is:
#
#   if ! type -p usage &> /dev/null
#       echo "Error: usage CLI not found. This is required for completions to
#       work in mise." >&2
#       return 1
#
# roles/fish/.../config.fish regenerates that file into
# ~/.config/fish/completions/mise.fish on every interactive shell, so without
# this the completion file exists, looks installed, and refuses to do anything.
# Nothing else reports the gap: `mise doctor` says "No problems found", because
# from mise's point of view nothing is wrong -- it is the generated completion
# script, not mise, that needs the binary.
#
# Cross-platform rather than in roles/linux, because the Macs have the same hole:
# no Brewfile declares usage, so their mise completions are equally dead. apt has
# no usage package either, so mise is the route on both.
usage = "5.0.0"
