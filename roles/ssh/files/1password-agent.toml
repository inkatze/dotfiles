# Which SSH keys the 1Password agent offers, and in what order.
#
# Managed by roles/ssh. Materialized with copy, NOT symlinked like the rest of
# this role's files: 1Password's desktop UI rewrites this file when the SSH
# agent's key settings are changed there, and an atomic replace would break a
# symlink and leave the tracked copy silently orphaned. Same reasoning that
# makes ~/.claude/settings.json a jq merge instead of a link. The repo is the
# source of truth; edits made in the 1Password UI are overwritten on the next
# playbook run.
#
# With no agent.toml at all, the agent offers every SSH key in every unlocked
# vault and account. That is not a security hole on its own -- each individual
# use is still authorized -- but two things follow that are worth pinning down:
#
#   1. The offered set grows silently as keys are added, including keys from
#      other accounts that have no business being presented to a personal host.
#   2. SSH gives up after roughly six rejected offers. Once enough keys
#      accumulate, a host needing the seventh fails to authenticate, and the
#      error names nothing useful.
#
# Order is significant: keys are offered top to bottom, so the key used most
# often belongs first.
#
# This file contains NO secrets. Item and vault names only; private keys never
# leave 1Password.

[[ssh-keys]]
item = "id_personal"
vault = "Private"
