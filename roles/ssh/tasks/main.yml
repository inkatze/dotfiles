---
- name: Create .ssh directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.ssh"
    state: directory
    mode: "0700"
  tags: [ssh]

- name: Symlink ssh config
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/ssh/files/config"
    dest: "{{ ansible_facts.env.HOME }}/.ssh/config"
    state: link
    force: true
    mode: "0600"
  tags: [ssh]

- name: Symlink known hosts
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/ssh/files/known_hosts"
    dest: "{{ ansible_facts.env.HOME }}/.ssh/known_hosts"
    state: link
    force: true
    mode: "0600"
  tags: [ssh]

# Machine-local companions to the two tracked files. They hold LAN host
# aliases and accepted LAN host keys, which REQ-F1.1 keeps out of this public
# repo. Created empty if absent so the ssh config's Include resolves and
# UserKnownHostsFile has a writable first entry; never overwritten, and the
# timestamp preservation keeps re-runs idempotent (changed=0).
- name: Ensure machine-local ssh files exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.ssh/{{ item }}"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  loop:
    - config.local
    - known_hosts.local
  tags: [ssh]

# `creates` keeps this idempotent: a new key on every run would lock this host
# out of the offload host until its public half was stored in 1Password again.
# -N '' because a passphrase brings back the prompt an unattended session
# cannot answer.
- name: Generate the offload-host key
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N '' -C 'dotfiles offload client'
      -f {{ ssh_offload_key | quote }}
    creates: "{{ ssh_offload_key }}"
  when: inventory_hostname in ssh_offload_client_hosts
  tags: [ssh, offload]

# Stat'd after generation, so the run that mints the key also restricts it.
- name: Check whether the offload-host key exists
  ansible.builtin.stat:
    path: "{{ ssh_offload_key }}"
  register: ssh_offload_key_stat
  check_mode: false
  when: inventory_hostname in ssh_offload_client_hosts
  tags: [ssh, offload]

- name: Restrict the offload-host key
  ansible.builtin.file:
    path: "{{ ssh_offload_key }}"
    mode: "0600"
  when:
    - inventory_hostname in ssh_offload_client_hosts
    - ssh_offload_key_stat.stat.exists
  tags: [ssh, offload]

- name: Read the offload-host public key
  ansible.builtin.command:
    cmd: cat {{ (ssh_offload_key ~ '.pub') | quote }}
  register: ssh_offload_pubkey
  changed_when: false
  failed_when: false
  check_mode: false
  when: inventory_hostname in ssh_offload_client_hosts
  tags: [ssh, offload]

# Nothing here can write it to 1Password: this host's service account reads
# only. The offload host renders its authorized key from that field.
- name: Explain where the offload-host public key goes
  ansible.builtin.debug:
    msg: >-
      Store this public key in the offload_client_pubkey field of the 1Password
      LAN item (see docs/offload-host.md); the offload host trusts it only from
      this host's address. Key: {{ ssh_offload_pubkey.stdout | default('') }}
  when:
    - inventory_hostname in ssh_offload_client_hosts
    - ssh_offload_pubkey.rc | default(1) == 0
  tags: [ssh, offload]

# The LAN aliases live in 1Password, not in this public repo (REQ-F1.1), and
# are rendered by `op inject` from the committed template. Detection is split
# from the sync deliberately: a host without the 1Password CLI genuinely cannot
# do this and is skipped, whereas a host that HAS op and still fails (locked
# vault, missing item, unresolved field) is a real error and fails the play.
# Hard-failing on a merely absent op would make linux-migration Task 7's
# "two consecutive runs, zero failed tasks" convergence unreachable.
- name: Detect the 1Password CLI
  ansible.builtin.command: op --version
  register: ssh_op_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [ssh]

- name: Sync LAN ssh aliases from 1Password
  ansible.builtin.command:
    cmd: "{{ ansible_facts.env.PWD }}/scripts/ssh-lan-config-sync.sh"
  register: ssh_lan_sync
  changed_when: "'CHANGED:' in ssh_lan_sync.stdout"
  when:
    - ssh_op_probe.rc == 0
    - lookup('ansible.builtin.env', 'CI', default='') == ''
  tags: [ssh]

- name: Report skipped LAN alias sync
  ansible.builtin.debug:
    msg: >-
      1Password CLI not found; ~/.ssh/config.local was left as-is. LAN host
      aliases will be missing on this host until `op` is installed and signed
      in. See roles/ssh/README.md.
  when: ssh_op_probe.rc != 0
  tags: [ssh]

- name: Symlink allowed signers
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/ssh/files/allowed_signers"
    dest: "{{ ansible_facts.env.HOME }}/.ssh/allowed_signers"
    state: link
    force: true
    mode: "0600"
  tags: [ssh]

# Same path on macOS and Linux, so this is cross-platform like the rest of the
# role. Harmless on a host without the 1Password desktop app: the file is read
# by the agent, and nothing else looks at it.
- name: Create the 1Password agent configuration directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/1Password/ssh"
    state: directory
    mode: "0700"
  tags: [ssh]

# copy, not link -- see the header of the source file for why.
- name: Deploy the 1Password SSH agent key list
  ansible.builtin.copy:
    src: 1password-agent.toml
    dest: "{{ ansible_facts.env.HOME }}/.config/1Password/ssh/agent.toml"
    mode: "0600"
  tags: [ssh]
