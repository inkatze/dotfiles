---

- name: Download neovim stable
  ansible.builtin.unarchive:
    src: "{{ neovim_download_url }}"
    dest: "{{ ansible_env.HOME }}/.local"
    remote_src: true
  tags: [neovim]

# /usr/local/bin is user-writable on a Homebrew Mac but root-owned on Linux, so
# the symlink needs elevation there and only there — become: true on macOS
# would itself be a behavior change (REQ-D1.2).
- name: Symlink neovim binary
  ansible.builtin.file:
    src: "{{ neovim_install_dir }}/bin/nvim"
    dest: /usr/local/bin/nvim
    state: link
  become: "{{ ansible_os_family != 'Darwin' }}"
  tags: [neovim]

- name: Symlink neovim configuration
  ansible.builtin.file:
    src: "{{ ansible_env.PWD }}/roles/neovim/files/nvim"
    dest: "{{ ansible_env.HOME }}/.config/nvim"
    state: link
  tags: [neovim]

- name: Restore neovim plugins
  ansible.builtin.command:
    cmd: nvim --headless '+Lazy! restore' +qa
  changed_when: false
  tags: [neovim]

- name: Install neovim plugins
  ansible.builtin.command:
    cmd: nvim --headless '+Lazy! install' +qa
  changed_when: false
  tags: [neovim]

- name: Install treesitter modules
  ansible.builtin.command:
    cmd: nvim --headless '+TSInstallSync all' +qa
  changed_when: false
  tags: [neovim]

- name: Upgrade neovim plugins
  ansible.builtin.command:
    cmd: nvim --headless '+Lazy! sync' +qa
  changed_when: false
  tags: [upgrade]

- name: Upgrade treesitter modules
  ansible.builtin.command:
    cmd: nvim --headless '+TSUpdateSync all' +qa
  changed_when: false
  tags: [upgrade]
