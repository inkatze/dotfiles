---

# planwright is the extraction of pair-flow's generalizable core, now a public
# Claude Code plugin. We install it through the standard marketplace flow rather
# than vendoring a copy or running its ~/.claude/ writer: add the repo as a
# marketplace, then install the plugin (both named planwright). The owner/repo
# shorthand is the form planwright's own README documents, and it needs no SSH
# key now that the repo is public. The plugin auto-wires its own hooks
# (SessionStart tool-discovery, PostToolUse tasks-pr-sync) via its
# hooks/hooks.json resolved against CLAUDE_PLUGIN_ROOT, so settings.json no
# longer wires them by hand, and doctrine docs/scripts resolve plugin-relative
# at runtime. Updates are handled by upgrade.yml via `claude plugin update`.
# The migrated slash commands (orchestrate, execute-task, spec-kickoff,
# spec-draft, self-review, polish, resume) are retired from the pair-flow
# commands/ dir; planwright supplies them as skills. The review-workflow
# commands planwright does not ship (panel-*, copilot-*, peer-review,
# code-review) stay. CI-guarded because the matrix has no `claude` CLI.

# Claude Code compares a marketplace's source by deep equality against the one
# it already recorded, and a full HTTPS URL records a different source KIND
# (`git`) than the shorthand (`github`). A machine provisioned before the role
# switched spellings therefore rejects the add below outright, which also takes
# the plugin install and everything after it in the run down with it. Reading
# both records rather than one: `settings.json` is what the add is checked
# against, and `known_marketplaces.json` is what `marketplace list` reports.
- name: Read the recorded planwright marketplace sources
  ansible.builtin.slurp:
    path: "{{ item }}"
  loop:
    - "{{ ansible_facts.env.HOME }}/.claude/settings.json"
    - "{{ ansible_facts.env.HOME }}/.claude/plugins/known_marketplaces.json"
  register: claude_marketplace_records
  failed_when: false
  when: lookup('ansible.builtin.env', 'CI', default='') == ''
  tags: [claude]

# Removing the marketplace keeps the plugin's enabledPlugins entry, and the
# install task below puts the plugin itself back, so nothing is lost.
- name: Remove a planwright marketplace recorded under a different source
  ansible.builtin.command:
    cmd: "{{ ansible_facts.env.HOME }}/.local/bin/claude plugin marketplace remove planwright"
  changed_when: true
  vars:
    claude_planwright_source: {source: github, repo: "{{ claude_planwright_repo }}"}
    # base64 of "{}", standing in for a file that does not exist.
    claude_settings_record: >-
      {{ claude_marketplace_records.results[0].content | default('e30=') | b64decode | from_json }}
    claude_known_record: >-
      {{ claude_marketplace_records.results[1].content | default('e30=') | b64decode | from_json }}
    claude_settings_planwright: >-
      {{ (claude_settings_record.extraKnownMarketplaces | default({})).planwright | default({}) }}
    claude_planwright_recorded: >-
      {{ [claude_settings_planwright.source | default(none),
          (claude_known_record.planwright | default({})).source | default(none)]
         | select | list }}
  when:
    - lookup('ansible.builtin.env', 'CI', default='') == ''
    - claude_planwright_recorded | reject('equalto', claude_planwright_source) | list | length > 0
  tags: [claude]

# Both idempotent: rc 0 on re-run, output reports "already".
- name: Add planwright plugin marketplace
  ansible.builtin.command:
    cmd: >-
      {{ ansible_facts.env.HOME }}/.local/bin/claude plugin marketplace add
      {{ claude_planwright_repo }}
  register: claude_planwright_marketplace
  changed_when: "'already' not in claude_planwright_marketplace.stdout"
  when: lookup('ansible.builtin.env', 'CI', default='') == ''
  tags: [claude]

- name: Install planwright plugin
  ansible.builtin.command:
    cmd: "{{ ansible_facts.env.HOME }}/.local/bin/claude plugin install planwright@planwright --scope user"
  register: claude_planwright_install
  changed_when: "'already' not in claude_planwright_install.stdout"
  when: lookup('ansible.builtin.env', 'CI', default='') == ''
  tags: [claude]
