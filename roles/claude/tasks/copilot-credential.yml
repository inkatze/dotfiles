---

# Temporary: a one-off cleanup, kept only until every host has run this role
# once. Removing the neovim role and then the /panel-review Copilot backend left
# nothing that uses GitHub Copilot's OAuth credential, yet it stays on disk,
# world-readable, on every host that ever signed in. Nothing this repo declares
# writes there any more, so once each host has run it the task (and its
# fixture) can go.
#
# Only this one path, and state: absent reports changed only when it removed
# something. A link at the path is removed as a link, never followed. Deleting
# the directory does not revoke the token; that is the GitHub-side step in the
# repo-root CLAUDE.md.
- name: Remove the stale GitHub Copilot credential directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/github-copilot"
    state: absent
  tags: [claude]
