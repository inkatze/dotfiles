---

# Claude Code configuration. CROSS-PLATFORM, which is the whole reason this role
# exists: all of it used to live in roles/osx, which is Darwin-guarded, so none
# of it reached the Linux host. The consequences were not cosmetic —
# ~/.claude/CLAUDE.md was absent, so the global instructions (including "do NOT
# add Co-Authored-By") were never in effect there; settings.json was unmanaged,
# so hooks, permissions and the attribution suppression never applied; and
# commands/ and scripts/ were missing entirely, so the custom slash commands and
# the worktree-bootstrap hook simply did not exist on that machine.
#
# Claude Code runs on Linux and macOS alike, so nothing here is platform
# specific. The genuinely macOS-only pieces (osx_defaults, the Library folder)
# stayed behind in roles/osx.

- name: Install Claude Code CLI
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
  changed_when: false
  tags: [claude]

- name: Update Claude Code CLI
  ansible.builtin.command:
    cmd: "{{ ansible_facts.env.HOME }}/.local/bin/claude update"
  changed_when: false
  tags: [claude, update]

- name: Create Claude configuration directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude"
    state: directory
    mode: '0755'
  tags: [claude]

- name: Symlink Claude environment documentation
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/claude/files/CLAUDE.md"
    dest: "{{ ansible_facts.env.HOME }}/.claude/CLAUDE.md"
    state: link
  tags: [claude]

# A merge rather than a symlink: Claude Code writes to this file itself
# (theme, onboarding state, per-project trust), so a symlink would have the app
# editing tracked repo content, and a wholesale copy would discard what the app
# legitimately owns. Hook arrays merge by ownership rather than replacement —
# see scripts/claude-settings-merge.sh.
- name: Ensure Claude settings.json contains managed settings
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.env.PWD }}/scripts/claude-settings-merge.sh"
      - "{{ ansible_facts.env.HOME }}/.claude/settings.json"
      - "{{ ansible_facts.env.PWD }}/roles/claude/files/settings.json"
  register: claude_settings
  changed_when: "'CHANGED' in claude_settings.stdout"
  tags: [claude]

- name: Symlink Claude custom commands
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/claude/files/commands"
    dest: "{{ ansible_facts.env.HOME }}/.claude/commands"
    state: link
  tags: [claude]

- name: Symlink Claude hook scripts
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/claude/files/scripts"
    dest: "{{ ansible_facts.env.HOME }}/.claude/scripts"
    state: link
  tags: [claude]

# `compact` is a custom style, not a built-in: Claude Code ships only Default,
# Proactive, Explanatory and Learning, so `outputStyle` in settings.json above
# resolves to nothing without this directory. It sets
# keep-coding-instructions: true, which a custom style needs to keep the
# built-in software engineering instructions; leaving it out replaces them.
- name: Symlink Claude output styles
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/claude/files/output-styles"
    dest: "{{ ansible_facts.env.HOME }}/.claude/output-styles"
    state: link
  tags: [claude]

# Gemini API key for the panel/code-review backend, moved here from
# roles/osx/tasks/homebrew.yml. Nothing about it was ever macOS-specific, and
# the Darwin guard on that role is what left this host with fish
# conf.d/gemini.fish exporting GEMINI_API_KEY from a file no task ever wrote.
#
# The tasks below keep the `osx` tag so `mise run osx` still syncs the key on
# a Mac, and gain `linux` so
# `mise run linux` does the same here.
#
# Still gated on non-work: the work host reviews through codex, so it has no
# use for a Gemini key, while `server` needs one exactly as `personal` and
# `alt` do. D-6 in specs/pair-flow/design.md is the origin of the codex-on-work
# split but predates this host and names only work/personal/alt, so it is
# background here rather than the authority for the `server` row; the current
# mapping lives in the repo CLAUDE.md's "Review backends" section.
#
# The directory holds the key file, so create it with private perms
# declaratively; the sync script also chmods it 700 best-effort as
# defense-in-depth.
- name: Ensure ~/.gemini directory exists with private perms
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.gemini"
    state: directory
    mode: '0700'
  when:
    - lookup('ansible.builtin.env', 'CI', default='') == ''
    - inventory_hostname != 'work'
  tags: [claude, osx, linux]

# Detection is split from the sync, exactly as roles/ssh does it for the LAN
# alias sync, and for the reason recorded there: a host without the 1Password
# CLI genuinely cannot do this and is skipped, while a host that HAS op and
# still fails (locked vault, missing item, unreadable token) is a real error
# and fails the play.
#
# That split was not needed while these tasks lived in the Darwin-guarded osx
# role, because the Brewfile guaranteed `op` on every Mac that ran them. Moving
# them into the unguarded claude role removes that guarantee, and an unguarded
# hard failure here would abort the LAST role in main.yml partway through,
# taking the planwright marketplace and plugin installs below with it, on any
# non-work host that has not been given a token yet. It would also put
# linux-migration Task 7's "two consecutive runs, zero failed tasks"
# convergence out of reach, which is the specific outcome the ssh role's
# comment warns against.
- name: Detect the 1Password CLI
  ansible.builtin.command: op --version
  register: claude_op_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [claude, osx, linux]

# The script strict-fails rather than skipping quietly when it cannot read the
# item: a silent skip would leave a stale key in place unnoticed. On a Mac that
# means an unlocked desktop app; on this headless host it means the
# machine-local service-account token, which is why the key item has to live in
# a vault a service account can be granted (not Personal or Private). See
# scripts/claude-gemini-auth-sync.sh.
- name: Sync Gemini API key from 1Password
  ansible.builtin.command:
    cmd: "{{ ansible_facts.env.PWD }}/scripts/claude-gemini-auth-sync.sh"
  register: claude_gemini_auth
  changed_when: "'CHANGED' in claude_gemini_auth.stdout"
  when:
    - claude_op_probe.rc == 0
    - lookup('ansible.builtin.env', 'CI', default='') == ''
    - inventory_hostname != 'work'
  tags: [claude, osx, linux]

- name: Report skipped Gemini key sync
  ansible.builtin.debug:
    msg: >-
      1Password CLI not found; ~/.gemini/.api-key was left as-is, so it is
      whatever it already was (absent on a host that has never synced). Until
      `op` is installed and either signed in or given a service-account token,
      /panel-review and /code-review will stop with their own auth message on
      any host where that file is missing. See CLAUDE.md "Review backends:
      codex vs gemini".
  when:
    - claude_op_probe.rc != 0
    - lookup('ansible.builtin.env', 'CI', default='') == ''
    - inventory_hostname != 'work'
  tags: [claude, osx, linux]

- name: Remove dangling pair-flow.yml symlink (repo-class retirement cleanup)
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude/pair-flow.yml"
    state: absent
  tags: [claude]

# Same retirement: the inbox substrate (specs/pair-flow/tasks.md Completed,
# "Retire Task 3") deleted inbox-sweep.sh, the only thing that ever cleaned
# up ~/.claude/inbox/ entries, without removing the directory itself. Any
# host that ran an old Claude Code session has stale {host}-{uuid}.json
# entries here with nothing left to sweep them.
- name: Remove orphaned inbox directory (cross-session inbox retirement cleanup)
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude/inbox"
    state: absent
  tags: [claude]

- name: Install the planwright plugin
  ansible.builtin.import_tasks: planwright.yml
