---

# planwright drops an overlay catalog that resolves outside its overlay root,
# so a symlink into this repo would never be read: the catalog goes in as a
# copy. Its marker first line is what makes a file at the destination this
# role's to replace or remove. Anything else there fails the run, since a
# green run that left it would leave the steps silently unregistered.
- name: Inspect the planwright steps catalog source
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ claude_steps_catalog_src | dirname }}"
    - "{{ claude_steps_catalog_src }}"
  register: claude_steps_src
  check_mode: false
  tags: [claude]

# Run from outside a checkout, every source would read as gone and the
# installed copy would be removed.
- name: Refuse to run without the steps catalog's directory
  ansible.builtin.fail:
    msg: >-
      {{ claude_steps_catalog_src | dirname }} is not a directory; run the
      playbook from the dotfiles checkout.
  when: not (claude_steps_src.results[0].stat.isdir | default(false))
  tags: [claude]

- name: Read the steps catalog source
  ansible.builtin.slurp:
    path: "{{ claude_steps_catalog_src }}"
  register: claude_steps_src_content
  when: claude_steps_src.results[1].stat.exists
  tags: [claude]

# A source without the marker would be refused as foreign on the next run.
- name: Refuse a steps catalog source without the marker
  ansible.builtin.fail:
    msg: >-
      {{ claude_steps_catalog_src }} must begin with the line
      "{{ claude_steps_catalog_marker }}".
  when:
    - claude_steps_src.results[1].stat.exists
    - (claude_steps_src_content.content | b64decode).split('\n')[0] != claude_steps_catalog_marker
  tags: [claude]

- name: Inspect the planwright adopter catalogs directory
  ansible.builtin.stat:
    path: "{{ claude_planwright_overlay }}/catalogs"
    follow: false
  register: claude_steps_catalogs
  check_mode: false
  tags: [claude]

- name: Refuse a planwright catalogs path that is not a plain directory
  ansible.builtin.fail:
    msg: >-
      {{ claude_planwright_overlay }}/catalogs is not a plain directory; merge
      any steps it holds into {{ claude_steps_catalog_src }}, remove it, then
      re-run.
  when:
    - claude_steps_src.results[1].stat.exists
    - claude_steps_catalogs.stat.exists
    - claude_steps_catalogs.stat.islnk or not claude_steps_catalogs.stat.isdir
  tags: [claude]

- name: Inspect the installed steps catalog
  ansible.builtin.stat:
    path: "{{ claude_planwright_overlay }}/catalogs/steps.yaml"
    follow: false
  register: claude_steps_dest
  check_mode: false
  when: claude_steps_catalogs.stat.isdir | default(false) and not claude_steps_catalogs.stat.islnk
  tags: [claude]

- name: Read the installed steps catalog
  ansible.builtin.slurp:
    path: "{{ claude_planwright_overlay }}/catalogs/steps.yaml"
  register: claude_steps_dest_content
  when:
    - claude_steps_dest.stat.isreg | default(false)
    - not claude_steps_dest.stat.islnk
  tags: [claude]

- name: Settle who owns the installed steps catalog
  ansible.builtin.set_fact:
    claude_steps_dest_marked: >-
      {{ (claude_steps_dest_content.content is defined)
         and (claude_steps_dest_content.content | b64decode).split('\n')[0] == claude_steps_catalog_marker }}
  tags: [claude]

- name: Refuse a steps catalog this role did not install
  ansible.builtin.fail:
    msg: >-
      {{ claude_planwright_overlay }}/catalogs/steps.yaml is not the dotfiles
      claude role's copy (a symlink, or its first line is not the marker);
      merge its entries into {{ claude_steps_catalog_src }}, remove it, then
      re-run.
  when:
    - claude_steps_src.results[1].stat.exists
    - claude_steps_dest.stat.exists | default(false)
    - not (claude_steps_dest_marked | bool)
  tags: [claude]

- name: Create the planwright adopter catalogs directory
  ansible.builtin.file:
    path: "{{ claude_planwright_overlay }}/catalogs"
    state: directory
    mode: "0755"
  when:
    - claude_steps_src.results[1].stat.exists
    - not claude_steps_catalogs.stat.exists
  tags: [claude]

- name: Install the planwright steps catalog
  ansible.builtin.copy:
    src: "{{ claude_steps_catalog_src }}"
    dest: "{{ claude_planwright_overlay }}/catalogs/steps.yaml"
    remote_src: true
    mode: "0644"
  when:
    - claude_steps_src.results[1].stat.exists
    # In check mode nothing created the directory the copy would land in.
    - claude_steps_catalogs.stat.exists or not ansible_check_mode
  tags: [claude]

- name: Remove the steps catalog whose source is gone
  ansible.builtin.file:
    path: "{{ claude_planwright_overlay }}/catalogs/steps.yaml"
    state: absent
  when:
    - not claude_steps_src.results[1].stat.exists
    - claude_steps_dest_marked | bool
  tags: [claude]
