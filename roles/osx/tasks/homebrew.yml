---

- name: Install common packages from Brewfile
  ansible.builtin.command:
    cmd: brew bundle install --no-upgrade --file={{ ansible_facts.env.PWD }}/Brewfile
  register: osx_brew_bundle_common
  changed_when: "'Installing' in osx_brew_bundle_common.stdout"
  tags: [osx]

- name: Install host-specific packages from Brewfile
  ansible.builtin.command:
    cmd: brew bundle install --no-upgrade --file={{ ansible_facts.env.PWD }}/Brewfile.{{ inventory_hostname }}
  register: osx_brew_bundle_host
  changed_when: "'Installing' in osx_brew_bundle_host.stdout"
  tags: [osx]

- name: Sync GitHub MCP server registration with Claude Code
  ansible.builtin.command:
    cmd: "{{ ansible_facts.env.PWD }}/scripts/claude-mcp-sync-github.sh"
  register: osx_claude_mcp_github
  changed_when: "'CHANGED' in osx_claude_mcp_github.stdout"
  when: lookup('ansible.builtin.env', 'CI', default='') == ''
  tags: [osx]

# The two Gemini API key tasks that used to sit here (the ~/.gemini directory
# and the 1Password sync) moved to roles/claude/tasks/main.yml. They were never
# macOS-specific, and living in this Darwin-guarded role meant the Linux host
# got the fish snippet that READS the key but nothing that writes it. They keep
# the `osx` tag there, so `mise run osx` still syncs the key on a Mac.

# Ollama daemon + model management lives on the work host only.
# Personal/alt hosts run the panel commands as clients and reach the
# work host's Ollama via OLLAMA_HOST + OLLAMA_BASE_URL (set in fish
# conf.d/ollama.fish).

- name: Check Ollama service state
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      brew services list | awk '/^ollama / {print $2}'
  register: osx_ollama_service_state
  changed_when: false
  when: inventory_hostname == 'work'
  tags: [osx, ollama]

# Start the service first so brew generates the LaunchAgent plist from the
# formula's service block. Editing the plist before this point would have
# PlistBuddy silently create a stub plist that suppresses brew's
# regeneration and breaks the daemon on a fresh work-host setup.
- name: Start Ollama service
  ansible.builtin.command:
    cmd: brew services start ollama
  when:
    - inventory_hostname == 'work'
    - osx_ollama_service_state.stdout != 'started'
  tags: [osx, ollama]

# Homebrew renamed its generated LaunchAgent plists from
# `homebrew.mxcl.<formula>` to `sh.brew.<formula>`, so a Mac that has only ever
# run current Homebrew has no `homebrew.mxcl.ollama.plist` at all.
#
# Hardcoding the old name did not fail loudly, which is what made it dangerous.
# PlistBuddy CREATES a missing file rather than erroring, so the read below
# fell through its own `failed_when: false`, the set task wrote OLLAMA_HOST
# into a *stub* carrying no Label and no ProgramArguments, and `launchctl
# bootstrap` on that stub died with "Bootstrap failed: 5: Input/output error".
# The real service meanwhile kept running untouched on 127.0.0.1, so the work
# host silently served nothing to the personal/alt Ollama clients -- the entire
# point of this block. Resolve the label from whichever plist brew actually
# generated instead, newest naming first, and fail loudly when neither is
# present rather than conjuring a stub to bootstrap.
- name: Locate the Ollama LaunchAgent plist
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for label in sh.brew.ollama homebrew.mxcl.ollama; do
        if [ -f "$HOME/Library/LaunchAgents/${label}.plist" ]; then
          printf '%s\n' "$label"
          exit 0
        fi
      done
      echo "no Ollama LaunchAgent plist found; did 'brew services start ollama' run?" >&2
      exit 1
  register: osx_ollama_label
  changed_when: false
  when: inventory_hostname == 'work'
  tags: [osx, ollama]

# Clean up after the bug described above. Only removes a file that is provably
# the stub -- brew is generating the new name AND the old file carries no
# `Label` key, which no real brew-generated plist ever omits. An old Homebrew
# where `homebrew.mxcl.ollama.plist` IS the live service is untouched, because
# then it is the resolved label and this task is skipped.
- name: Remove the stale Ollama LaunchAgent stub
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      stub="$HOME/Library/LaunchAgents/homebrew.mxcl.ollama.plist"
      [ -f "$stub" ] || exit 9
      /usr/libexec/PlistBuddy -c "Print :Label" "$stub" >/dev/null 2>&1 && exit 9
      launchctl bootout "gui/$(id -u)/homebrew.mxcl.ollama" 2>/dev/null || true
      rm -f "$stub"
  register: osx_ollama_stub_removed
  changed_when: osx_ollama_stub_removed.rc == 0
  failed_when: osx_ollama_stub_removed.rc not in [0, 9]
  when:
    - inventory_hostname == 'work'
    - osx_ollama_label.stdout | default('') == 'sh.brew.ollama'
  tags: [osx, ollama]

- name: Read current OLLAMA_HOST from Ollama LaunchAgent plist
  ansible.builtin.command:
    cmd: >-
      /usr/libexec/PlistBuddy -c "Print :EnvironmentVariables:OLLAMA_HOST"
      {{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ osx_ollama_label.stdout }}.plist
  register: osx_ollama_host_current
  failed_when: false
  changed_when: false
  when: inventory_hostname == 'work'
  tags: [osx, ollama]

- name: Set OLLAMA_HOST=0.0.0.0:11434 in Ollama LaunchAgent plist
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      plist="{{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ osx_ollama_label.stdout }}.plist"
      if /usr/libexec/PlistBuddy -c "Print :EnvironmentVariables:OLLAMA_HOST" "$plist" >/dev/null 2>&1; then
        /usr/libexec/PlistBuddy -c "Set :EnvironmentVariables:OLLAMA_HOST 0.0.0.0:11434" "$plist"
      else
        /usr/libexec/PlistBuddy -c "Add :EnvironmentVariables:OLLAMA_HOST string 0.0.0.0:11434" "$plist"
      fi
  when:
    - inventory_hostname == 'work'
    - (osx_ollama_host_current.stdout | default('') | trim) != '0.0.0.0:11434'
  register: osx_ollama_host_plist_set
  changed_when: osx_ollama_host_plist_set.rc == 0
  tags: [osx, ollama]

- name: Export OLLAMA_HOST into the current launchd session
  ansible.builtin.command:
    cmd: launchctl setenv OLLAMA_HOST 0.0.0.0:11434
  changed_when: false
  when: inventory_hostname == 'work'
  tags: [osx, ollama]

# Reload via launchctl, NOT `brew services restart`. The latter regenerates
# the plist from the formula's `service` block on every invocation, which
# wipes the OLLAMA_HOST key we just added (the formula bakes in
# OLLAMA_FLASH_ATTENTION and OLLAMA_KV_CACHE_TYPE, so those survive; nothing
# we add does). bootout+bootstrap reloads the existing plist as-is.
- name: Reload Ollama LaunchAgent to pick up OLLAMA_HOST change
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      plist="{{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ osx_ollama_label.stdout }}.plist"
      uid="$(id -u)"
      launchctl bootout "gui/$uid/{{ osx_ollama_label.stdout }}" 2>/dev/null || true
      launchctl bootstrap "gui/$uid" "$plist"
  when:
    - inventory_hostname == 'work'
    - osx_ollama_host_plist_set is changed
  tags: [osx, ollama]

- name: List installed Ollama models
  ansible.builtin.command:
    cmd: ollama list
  register: osx_ollama_models
  changed_when: false
  when: inventory_hostname == 'work'
  tags: [osx, ollama-models]

- name: Pull Ollama panel-backend models
  ansible.builtin.command:
    cmd: "ollama pull {{ item }}"
  loop:
    - qwen2.5-coder:32b
    - gpt-oss:20b
  when:
    - inventory_hostname == 'work'
    - item not in osx_ollama_models.stdout
  tags: [osx, ollama-models]
