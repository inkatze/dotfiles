---

# The offload host's server side: render the key the dispatching host logs in
# with, and check that an administrator has closed password login.

# macOS starts sshd per connection through launchd only while Remote Login is
# on, and turning it off from here would cut the session running this play.
- name: Check that Remote Login is on
  ansible.builtin.command: launchctl print system/com.openssh.sshd
  register: osx_offload_remote_login
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [osx, offload]

- name: Require Remote Login
  ansible.builtin.assert:
    that: osx_offload_remote_login.rc == 0
    fail_msg: >-
      Remote Login is off, so nothing can reach this host over SSH. Turn it on
      in System Settings, General, Sharing, Remote Login, allowing at least
      {{ osx_offload_user }}, then re-run.
    quiet: true
  tags: [osx, offload]

# An absent `op` fails here rather than skipping: this host exists to be
# reached by that key, and by this point either Homebrew has installed `op` or
# the required-tools check in main.yml has found it on PATH.
- name: Render the offload authorized key from 1Password
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.env.PWD }}/scripts/op-render.sh"
      - "{{ role_path }}/files/offload/authorized_keys.offload.tpl"
      - "{{ osx_offload_op_item }}"
      - "{{ osx_offload_authorized_keys }}"
  register: osx_offload_render
  changed_when: "'CHANGED' in osx_offload_render.stdout"
  tags: [osx, offload]

# Installing the hardening needs root, which the standard work account does not
# have. An administrator runs scripts/offload-sshd-harden.sh from a checkout of
# their own (docs/offload-host.md): it refuses unless the key below is in
# place, validates and installs the drop-in, asserts the effective config as a
# connection from the from= address gets it, and removes a drop-in it just
# installed if that fails. This play only checks the result, which needs no
# root since the drop-in is world-readable.
- name: Check the installed sshd hardening drop-in
  ansible.builtin.stat:
    path: "/etc/ssh/sshd_config.d/{{ osx_offload_sshd_dropin }}"
    checksum_algorithm: sha256
  register: osx_offload_dropin
  check_mode: false
  tags: [osx, offload]

- name: Report sshd hardening still to install
  ansible.builtin.debug:
    msg: >-
      Password SSH login is still on: the sshd hardening drop-in is not
      installed. An administrator on the Mac runs
      scripts/offload-sshd-harden.sh {{ osx_offload_user }} from their own
      checkout, as docs/offload-host.md shows.
  when: not osx_offload_dropin.stat.exists
  tags: [osx, offload]

# A drop-in that differs from the tracked one is stale after a repo change, or
# was edited on the host; either way the administrator re-runs the script.
- name: Require the tracked sshd hardening drop-in
  ansible.builtin.assert:
    that: osx_offload_dropin.stat.checksum == osx_offload_dropin_tracked
    fail_msg: >-
      /etc/ssh/sshd_config.d/{{ osx_offload_sshd_dropin }} differs from
      roles/osx/files/sshd/{{ osx_offload_sshd_dropin }}. An administrator
      re-runs scripts/offload-sshd-harden.sh {{ osx_offload_user }}
      (docs/offload-host.md).
    quiet: true
  vars:
    osx_offload_dropin_tracked: >-
      {{ lookup('ansible.builtin.file', role_path ~ '/files/sshd/' ~ osx_offload_sshd_dropin, rstrip=false)
         | hash('sha256') }}
  when: osx_offload_dropin.stat.exists
  tags: [osx, offload]
