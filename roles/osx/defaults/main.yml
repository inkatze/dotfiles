---

# Docs
# https://docs.ansible.com/ansible/2.5/modules/osx_defaults_module.html

# Section: OSX defaults ->>1
# -------------------------------------------------------------------------
osx_defaults:
  # Section: General ->>2
  # -------------------------------------------------------------------------
  - domain: com.apple.LaunchServices
    key: LSQuarantine
    type: bool
    value: false
    meta: Disables open application confirmation dialog
  - domain: NSGlobalDomain
    key: NSAutomaticSpellingCorrectionEnabled
    type: bool
    value: false
  - domain: NSGlobalDomain
    key: NSAutomaticQuoteSubstitutionEnabled
    type: bool
    value: false
  - domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: false
  - domain: NSGlobalDomain
    key: NSAutomaticDashSubstitutionEnabled
    type: bool
    value: false
  - domain: NSGlobalDomain
    key: NSAutomaticPeriodSubstitutionEnabled
    type: bool
    value: false
  - domain: NSGlobalDomain
    key: AppleInterfaceStyle
    type: string
    value: Dark
  - domain: com.apple.SoftwareUpdate
    key: ScheduleFrequency
    type: int
    value: 1

  # Section: Menu bar ->>2
  # -------------------------------------------------------------------------
  - domain: com.apple.systemuiserver
    key: NSStatusItem Visible com.apple.menuextra.bluetooth
    type: int
    value: 1
  - domain: com.apple.systemuiserver
    key: NSStatusItem Visible com.apple.menuextra.volume
    type: int
    value: 1
  - domain: com.apple.menuextra.battery
    key: ShowPercent
    type: string
    value: "YES"

  # Section: I/O ->>2
  # -------------------------------------------------------------------------

  # Section: Keyboard ->>3
  - domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 18
  - domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 3

    # Section: Mouse/Trackpad ->>3
  - domain: NSGlobalDomain
    key: com.apple.mouse.tapBehavior
    type: int
    value: 1
  - domain: NSGlobalDomain
    key: com.apple.mouse.tapBehavior
    type: int
    value: 1
  - domain: com.apple.AppleMultitouchTrackpad
    key: Clicking
    type: int
    value: 1
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Clicking
    type: int
    value: 1
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: TrackpadThreeFingerDrag
    type: bool
    value: true
  - domain: com.apple.AppleMultitouchTrackpad
    key: TrackpadThreeFingerDrag
    type: bool
    value: true
  - domain: NSGlobalDomain
    key: com.apple.AppleMultitouchTrackpad.TrackpadFourFingerHorizSwipeGesture
    type: int
    value: 2

    # Section: All mighty measurement system ->>3
  - domain: NSGlobalDomain
    key: AppleMeasurementUnits
    type: string
    value: Centimeters
  - domain: NSGlobalDomain
    key: AppleMetricUnits
    type: bool
    value: true

    # Section: Password prompt when screensaver is shown ->>3
  - domain: com.apple.screensaver
    key: askForPassword
    type: int
    value: 1
  - domain: com.apple.screensaver
    key: askForPasswordDelay
    type: int
    value: 0

  # Section: Finder ->>2
  # -------------------------------------------------------------------------
  - domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: PfHm
  - domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: file://{{ ansible_facts.env.HOME }}/
  - domain: com.apple.finder
    key: ShowRecentTags
    type: int
    value: 0
  - domain: com.apple.finder
    key: ShowExternalHardDrivesOnDesktop
    type: int
    value: 0
  - domain: com.apple.finder
    key: ShowMountedServersOnDesktop
    type: int
    value: 0
  - domain: com.apple.finder
    key: ShowRemovableMediaOnDesktop
    type: int
    value: 1
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
  - domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: SCcf
  - domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true
  - domain: com.apple.finder
    key: _FXShowPosixPathInTitle
    type: bool
    value: true
  - domain: com.apple.desktopservices
    key: DSDontWriteNetworkStores
    type: bool
    value: true
  - domain: com.apple.desktopservices
    key: DSDontWriteUSBStores
    type: bool
    value: true

  # Section: Dock ->>2
  # -------------------------------------------------------------------------
  - domain: com.apple.dock
    key: magnification
    type: int
    value: 1
  - domain: com.apple.dock
    key: minimize-to-application
    type: int
    value: 1
  - domain: com.apple.dock
    key: largesize
    type: float
    value: 80
  - domain: com.apple.dock
    key: tilesize
    type: float
    value: 50
  - domain: com.apple.dock
    key: show-recents
    type: int
    value: 0

  # Section: Spotlight ->>2
  # -------------------------------------------------------------------------
  - domain: com.apple.lookup.shared
    key: LookupSuggestionsDisabled
    type: int
    value: 1

  - domain: com.apple.systemuiserver
    key: menuExtras
    type: array
    value:
      - "/System/Library/CoreServices/Menu Extras/Clock.menu"
      - "/System/Library/CoreServices/Menu Extras/Battery.menu"
      - "/System/Library/CoreServices/Menu Extras/AirPort.menu"
      - "/System/Library/CoreServices/Menu Extras/Displays.menu"
      - "/System/Library/CoreServices/Menu Extras/Bluetooth.menu"
      - "/System/Library/CoreServices/Menu Extras/Volume.menu"

osx_list_defaults:
  - domain: com.apple.Spotlight
    key: orderedItems
    type: array
    value:
      - '{enabled = 1;name = APPLICATIONS;}'
      - '{enabled = 1;name = "SYSTEM_PREFS";}'
      - '{enabled = 1;name = DIRECTORIES;}'
      - '{enabled = 1;name = PDF;}'
      - '{enabled = 1;name = "MENU_CONVERSION";}'
      - '{enabled = 1;name = "MENU_EXPRESSION";}'
      - '{enabled = 1;name = "MENU_DEFINITION";}'
      - '{enabled = 1;name = DOCUMENTS;}'
      - '{enabled = 1;name = CONTACT;}'
      - '{enabled = 0;name = MESSAGES;}'
      - '{enabled = 0;name = "EVENT_TODO";}'
      - '{enabled = 0;name = IMAGES;}'
      - '{enabled = 0;name = BOOKMARKS;}'
      - '{enabled = 0;name = MUSIC;}'
      - '{enabled = 0;name = FONTS;}'
      - '{enabled = 0;name = MOVIES;}'
      - '{enabled = 0;name = PRESENTATIONS;}'
      - '{enabled = 0;name = SPREADSHEETS;}'
      - '{enabled = 0;name = "MENU_OTHER";}'
      - '{enabled = 0;name = "MENU_SPOTLIGHT_SUGGESTIONS";}'

# Health signal (specs/linux-migration Task 10, REQ-E1.6).
#
# Scoped by inventory alias, not platform: polling the server is one machine's
# job. Two Macs running this would double every alert, which trains you to
# ignore them. `work` was chosen because it is the machine that is actually open
# most of the day.
#
# The blind spot is inherent and worth remembering before trusting this: a
# LaunchAgent on a laptop does not run while the lid is shut, so "no alert" and
# "all healthy" are indistinguishable exactly when the server dies overnight.
# REQ-E1.6 permits an external uptime monitor instead for precisely this reason.
osx_health_signal_hosts:
  - work

osx_health_check_bin: "{{ ansible_facts.env.HOME }}/.local/bin/dotfiles-health-check"
osx_health_credentials_file: "{{ ansible_facts.env.HOME }}/.config/dotfiles/pushover-credentials"
osx_health_launch_label: com.inkatze.dotfiles.health-signal

# 15 minutes. Short enough that an outage is noticed within a coffee break,
# long enough that a flaky LAN moment does not generate noise -- and the check
# alerts on state TRANSITIONS, so even a long outage produces one notification
# rather than one per interval.
osx_health_interval_seconds: 900

# Percent used on the server's root filesystem. 85 leaves real headroom on a
# 914 GB disk (roughly 137 GB free at the trigger) while still firing long
# before anything breaks.
osx_health_disk_threshold: 85

# Offload host: a Mac another person owns and uses, which runs dispatched work
# in a dedicated account while she is away (docs/offload-host.md).
osx_offload_hosts:
  - offload

# The macOS account the work runs in. The playbook refuses to configure the
# offload host from any other account, so the owner's account never receives
# the toolchain or its credentials. Must match the offload_user field of the
# 1Password LAN item, which the dispatching host logs in as.
osx_offload_user: fleet

# What the rest of the playbook calls, checked on the offload host, where
# nothing is installed with Homebrew.
osx_offload_required_tools: [brew, op, jq, mise, fish, tmux, gh, git]

# Installed by mise from roles/osx/files/mise-offload/offload.toml, in this
# order (uv before the pipx: entry).
osx_offload_mise_tools: [uv, "pipx:ansible-core", gh, jq, tmux, gitleaks, gemini]
osx_offload_mise_bin: "{{ ansible_facts.env.HOME }}/.local/bin/mise"
osx_offload_mise_conf_d: "{{ ansible_facts.env.HOME }}/.config/mise/conf.d"
# The owner's Homebrew binaries, used read-only (Apple silicon's prefix).
osx_offload_brew_bin: /opt/homebrew/bin

osx_offload_op_item: dotfiles-lan-ssh
osx_offload_sshd_dropin: 050-dotfiles-hardening.conf

# The Mac as a self-hosted GitHub Actions runner, in the offload account only:
# one runner per repository, each its own directory and launchd agent.
# Version and checksum move together; the checksum is the one in that release's
# notes (https://github.com/actions/runner/releases).
osx_runner_version: 2.338.2
osx_runner_arch: arm64
osx_runner_sha256: 25a065af409ffa317ab4d5a3b614dd15fc9c40f2172bc1b35a1b1258e919a388
osx_runner_asset: "actions-runner-osx-{{ osx_runner_arch }}-{{ osx_runner_version }}.tar.gz"
osx_runner_url: "https://github.com/actions/runner/releases/download/v{{ osx_runner_version }}/{{ osx_runner_asset }}"
osx_runner_root: "{{ ansible_facts.env.HOME }}/actions-runners"
osx_runner_labels: mac-fleet
osx_runner_launch_prefix: com.inkatze.dotfiles.runner
osx_runner_nice: 10
osx_runner_path: "{{ osx_offload_mise_bin | dirname }}:{{ osx_runner_shims }}:{{ osx_offload_brew_bin }}:/usr/bin:/bin"
osx_runner_shims: "{{ ansible_facts.env.HOME }}/.local/share/mise/shims"

# Repositories whose names this repo already carries. Private ones come from
# the machine-local file below, one owner/repo per line (# comments allowed).
osx_runner_repos:
  - inkatze/planwright
  - inkatze/dotfiles
osx_runner_repos_file: "{{ ansible_facts.env.HOME }}/.config/dotfiles/runner-repos"

# No new job starts while another account owns the console or the keyboard and
# mouse have been idle for less than this.
osx_runner_idle_seconds: 300
