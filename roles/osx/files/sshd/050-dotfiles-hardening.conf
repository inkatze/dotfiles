# Installed by the dotfiles scripts/offload-sshd-harden.sh on the offload host;
# the playbook fails while a hand edit makes it differ from the tracked copy.
# Named to sort before macOS's own 100-macos.conf, because sshd keeps the first
# value it reads for each keyword.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
# Replaces the default rather than adding to it, so the default file is
# restated; dropping it would lock out every key in authorized_keys.
AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys.offload
