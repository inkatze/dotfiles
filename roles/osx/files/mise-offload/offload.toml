# Offload-host mise tools, linked into ~/.config/mise/conf.d on that host only.
#
# The work account there is a standard account and the Homebrew prefix belongs
# to the Mac's owner, so nothing is installed with Homebrew; what the playbook
# and dispatched work need comes from here, user-level, instead. Pinned like
# roles/linux/files/mise/linux.toml, whose entries these mirror where they
# overlap, so a bump is a reviewed commit.
#
# Not here, and so required from the owner's Homebrew (read-only): `brew` and
# `fish`, which the fish and environments roles resolve through `brew
# --prefix`, and `op`, whose mise route is a third-party plugin rather than a
# release download.
[tools]

# Before the pipx: entry: mise's pipx backend runs `uv tool install`.
uv = "0.11.32"

# ansible-core, not the PyPI `ansible` bundle, for the reason linux.toml gives.
# The osx role also needs community.general, installed beside it with
# `ansible-galaxy collection install` (docs/offload-host.md).
"pipx:ansible-core" = "2.21.2"

gh = "2.96.0"
jq = "1.8.2"
tmux = "3.7c"
gitleaks = "8.30.0"
