---

# The fish install prefix. This was an unguarded `brew --prefix`, and because
# it carries tags: [always] it ran on EVERY invocation regardless of --tags —
# so on a Linux host the play died here before reaching any selected task,
# making the entire playbook unrunnable. Homebrew stays the source of truth on
# macOS (REQ-D1.2: same command, same value); Linux uses /usr, where the apt
# fish lands at /usr/bin/fish.
- name: Get the Homebrew prefix (macOS only)
  ansible.builtin.command:
    cmd: brew --prefix
  register: fish_brew_prefix
  changed_when: false
  when: ansible_facts.os_family == "Darwin"
  tags: [always]

- name: Resolve the fish install prefix
  ansible.builtin.set_fact:
    fish_prefix: "{{ fish_brew_prefix.stdout if ansible_facts.os_family == 'Darwin' else '/usr' }}"
  tags: [always]

- name: Create fish configuration directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config"
    recurse: true
    state: directory
  tags: [fish]

- name: Symlink fish configuration
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/fish/files/fish"
    dest: "{{ ansible_facts.env.HOME }}/.config/fish"
    state: link
  tags: [fish]

# conf.d/ is in .gitignore (fisher writes plugin shims there), so tracked
# snippets live alongside fish/ and get symlinked into conf.d at runtime.
# Ensure the dir exists first: on a fresh checkout (or in CI) nothing has
# populated conf.d yet, so the symlink dest's parent does not exist.
- name: Create fish conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/fish/conf.d"
    state: directory
    mode: "0755"
  tags: [fish]

- name: Symlink ollama.fish into fish conf.d
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/fish/files/ollama.fish"
    dest: "{{ ansible_facts.env.HOME }}/.config/fish/conf.d/ollama.fish"
    state: link
  tags: [fish]

- name: Symlink gemini.fish into fish conf.d
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/fish/files/gemini.fish"
    dest: "{{ ansible_facts.env.HOME }}/.config/fish/conf.d/gemini.fish"
    state: link
  tags: [fish]


- name: Symlink ssh-auth.fish into fish conf.d
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/fish/files/ssh-auth.fish"
    dest: "{{ ansible_facts.env.HOME }}/.config/fish/conf.d/ssh-auth.fish"
    state: link
  tags: [fish]

- name: Install fisherman
  ansible.builtin.shell:
    cmd: >
      curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish |
      source && fisher install jorgebucaran/fisher
    executable: "{{ fish_prefix }}/bin/fish"
  when: fish_plugins | length > 0
  changed_when: false
  tags: [fish, skip_ansible_lint]  # Fish does not have a pipefail option

- name: Retrieve installed fisherman packages
  ansible.builtin.shell:
    cmd: fisher list
    executable: "{{ fish_prefix }}/bin/fish"
  register: fish_fisherman_plugins
  changed_when: false
  failed_when: false
  when: fish_plugins | length > 0
  tags: [fish]

- name: Install fish plugins
  ansible.builtin.shell:
    cmd: fisher install {{ item }}
    executable: "{{ fish_prefix }}/bin/fish"
  with_items: "{{ fish_plugins }}"
  when: "fish_plugins | list and item not in fish_fisherman_plugins.stdout"
  changed_when: true  # It updates the plugin every time this runs
  tags: [fish]

- name: Symlink theme configuration
  ansible.builtin.file:
    src: "{{ ansible_facts.env.PWD }}/roles/fish/files/starship.toml"
    dest: "{{ ansible_facts.env.HOME }}/.config/starship.toml"
    state: link
  tags: [fish]

- name: Update fisherman plugins
  ansible.builtin.shell:
    cmd: fisher update
    executable: "{{ fish_prefix }}/bin/fish"
  changed_when: false
  tags: [upgrade]

- name: Import tasks to add fish to shells
  ansible.builtin.include_tasks: shell.yml
  tags: [shell]
