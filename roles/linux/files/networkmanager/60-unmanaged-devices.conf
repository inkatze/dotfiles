# Managed by the dotfiles linux role -- do not edit by hand; the next playbook
# run overwrites this file. Source: roles/linux/files/networkmanager/.
#
# t2_ncm is the Apple T2 coprocessor's NCM link. It is not a network, but it
# looks like one: its carrier reads 1 and operstate up, so NetworkManager treats
# it as a live wire and starts DHCP on it.
#
# Nothing behind it answers, so every attempt runs the full 90 s DHCP timeout,
# fails with ip-config-unavailable, and retries after a five-minute backoff.
# Measured on this host before the fix: 27 failed activations in one boot at a
# metronomic 6 m 30 s (90 s + 5 min), and t2_ncm was the only device failing.
#
# The reason a profile activates there at all is that "Wired Connection" sets no
# connection.interface-name and carries connection.multi-connect=3 (multiple),
# which explicitly permits it on several devices at once. So NM brings it up on
# the real USB ethernet adapter, where it works, AND on t2_ncm, where it cannot.
#
# Fixed at the device rather than the profile, deliberately. Pinning the profile
# (connection.interface-name plus multi-connect=single) would hardcode an
# interface name derived from the dongle's MAC, so swapping dongles breaks it,
# and the name itself is the kind of operational identity REQ-F1.1 keeps out of
# this repo. "The coprocessor link is not a network" is true regardless of what
# ethernet hardware is plugged in.
#
# keyfile.unmanaged-devices rather than a [device] section with managed=0: the
# man page is explicit that a device unmanaged this way is "strictly unmanaged"
# and cannot be overruled, whereas [device] managed "can be overruled at runtime
# via D-Bus". Strict is the honest statement here, and it means a stray
# `nmcli device set t2_ncm managed yes` cannot quietly restart the failure loop.
#
# This REPLACES a hand-written /etc/NetworkManager/conf.d/99-network-t2-ncm.conf
# that set `[main] no-auto-default=t2_ncm`. That was the wrong knob and never
# worked: no-auto-default only stops NM from GENERATING its own default wired
# profile for a device, and does nothing about an existing user profile matching
# it, which is what was happening. The role removes that file.
[keyfile]
unmanaged-devices=interface-name:t2_ncm
