# mpv configuration for the Linux host.
#
# Written for what this machine actually is: a CoffeeLake-H laptop with three
# GPUs, whose internal panel (eDP-1) hangs off the *clamped* Baffin on card2
# while the RX 580 eGPU on card0 drives external displays. That asymmetry is
# the reason for most of the non-obvious choices below, and it is why the
# expensive settings live in an opt-in profile rather than at the top level.
#
# Framing worth keeping in mind before tuning anything here: for 8-bit H.264 --
# which is most of what this host plays -- every decoder in existence produces
# bit-identical frames. Hardware vs software decode is a power and CPU-time
# decision, NOT a picture-quality one. Everything that actually changes what
# reaches the panel is in the scaling, dithering and debanding sections.


# ---------------------------------------------------------------------------
# Renderer
# ---------------------------------------------------------------------------

# gpu-next is the libplacebo-backed renderer. Preferred over `gpu` because the
# quality knobs below (particularly debanding and the downscaling correctness
# flags) are better implemented there.
vo=gpu-next

# Vulkan rather than the OpenGL default. RADV is already on this host --
# mesa-vulkan-drivers is in the baseline for the Task 9 compute work -- so this
# costs no new dependency, and libplacebo's Vulkan path is its best-supported
# one.
#
# If playback ever fails to start with a Vulkan device error (most likely after
# a Mesa upgrade, or when running against a GPU that is mid-reset), the fallback
# is `gpu-api=opengl`. Same renderer, no config changes elsewhere.
gpu-api=vulkan

# VA-API decode through radeonsi, which ships in mesa-libgallium and is already
# installed. Polaris (GCN 4) has UVD 6.3 and decodes H.264 and HEVC in fixed
# function silicon, so this keeps the CPU idle during playback.
#
# Explicit `vaapi` rather than `auto-safe`: auto-safe probes and silently falls
# back to software, which is indistinguishable from success until you notice the
# fans. Naming the method means a broken driver surfaces as an error.
#
# Verify with `vainfo` -- look for VAProfileH264High under the VAEntrypointVLD
# entrypoint. If that is missing, the problem is the driver, not this file.
hwdec=vaapi

# MUST be set on this host. mpv's --vaapi-device default is the literal string
# /dev/dri/renderD128, which here is the Intel UHD 630 -- a GPU with no display
# attached and, by the deliberate omission of intel-media-va-driver from
# linux_apt_packages, no VA driver installed either. Left at the default, mpv
# tries iHD_drv_video.so, then i965_drv_video.so, finds neither, and drops to
# software decoding without failing. Observed exactly that way before this line
# existed; it is the silent fallback the vainfo note above warns about, and it
# looks identical to success until the fans spin up.
#
# by-path rather than /dev/dri/renderD129, because the renderD numbers are
# assigned in probe order and this machine has a Thunderbolt eGPU: boot without
# it attached and the numbering shifts under any hard-coded path. The by-path
# names are PCI addresses and do not move.
#
# 01:00.0 is the internal Baffin, which is the GPU driving eDP-1 -- decode
# belongs on the card that already owns the display, otherwise every frame is
# copied across the bus to be presented. The `smooth` profile at the bottom
# repoints this at the eGPU for external displays.
vaapi-device=/dev/dri/by-path/pci-0000:01:00.0-render

# Keep decoded frames on the GPU and hand them straight to the renderer instead
# of round-tripping through system memory.
hwdec-codecs=all


# ---------------------------------------------------------------------------
# Scaling
# ---------------------------------------------------------------------------
# These only matter when the video is not being displayed at exactly its native
# resolution. For 1080p content on a higher-resolution panel -- the common case
# here -- every one of them is in play.

# ewa_lanczossharp is a polar (elliptical weighted average) filter. Slower than
# the bilinear default and visibly sharper on upscale without the ringing that
# plain lanczos produces on high-contrast edges. This is the single setting that
# does the most for animated content, which tends to be flat colour bounded by
# hard lines.
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Downscaling wants a different filter than upscaling: mitchell is soft enough
# not to alias when many source pixels collapse into one.
dscale=mitchell

# Scale in linear light rather than gamma-encoded space. Without these, resizing
# darkens fine detail -- the error is small per-pixel and very visible across a
# gradient.
correct-downscaling=yes
linear-downscaling=yes

# Sigmoidal upscaling suppresses the halo ewa filters would otherwise leave
# around sharp edges. Pairs with scale= above; not useful on its own.
sigmoid-upscaling=yes


# ---------------------------------------------------------------------------
# Debanding
# ---------------------------------------------------------------------------
# The highest-value section for animation specifically. Anime encodes carry
# large flat gradients (skies, fog, lighting washes) that H.264's 8-bit
# quantisation turns into visible contour bands. Debanding dithers those
# boundaries away at playback time; it cannot recover detail the encode threw
# out, but it stops the eye from locking onto the steps.
deband=yes

# Defaults are 1/32/16/48. The threshold is lowered and the iteration count
# raised relative to stock because the failure mode being targeted here is
# wide-and-shallow gradient banding rather than harsh block artifacts.
#
# If this ever softens fine texture (film grain especially -- live action is a
# different problem than animation), lower deband-iterations first.
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=32

# Dither to the panel's actual bit depth on the way out. `auto` reads the depth
# from the display rather than assuming 8-bit, and temporal dithering varies the
# pattern per frame so it does not read as static noise.
dither-depth=auto
temporal-dither=yes


# ---------------------------------------------------------------------------
# Timing
# ---------------------------------------------------------------------------

# Resample audio slightly to lock video to the display's refresh clock. This is
# what removes the periodic dropped/duplicated frame you otherwise get playing
# 23.976fps content on a 60Hz panel. The audio pitch shift is far below audible.
video-sync=display-resample

# Interpolation is deliberately NOT enabled here, and this is the one place the
# "highest quality" instinct is wrong on this hardware.
#
# It would smooth 24fps judder, but it is a per-frame shader pass on top of the
# ewa scaling above, and the internal panel is driven by the Baffin that
# roles/linux/tasks/power.yml pins to its lowest DPM state for thermal headroom.
# Stacking both on a clamped GPU trades a rare judder artifact for frame drops,
# which are worse and constant.
#
# On an external display driven by the RX 580 eGPU -- which that same udev rule
# releases to `auto` -- there is headroom for it. That is what the `smooth`
# profile at the bottom of this file is for.
interpolation=no


# ---------------------------------------------------------------------------
# Track selection
# ---------------------------------------------------------------------------

# Original-language audio with English subtitles. Most of the anime on this host
# ships two audio tracks (a Japanese original and an English dub), and mpv
# otherwise picks whichever the muxer happened to put first.
#
# Multiple codes per language because container tagging is inconsistent: some
# files use ISO 639-2 (jpn), some 639-1 (ja), some neither correctly.
alang=jpn,ja,jp,eng,en
slang=eng,en,enm

# Pick up sidecar subtitle files whose names are close to the video's rather
# than requiring an exact match.
sub-auto=fuzzy

# Let the audio device negotiate its own channel count instead of forcing a
# downmix. AC3 tracks are commonly 5.1; on stereo output mpv downmixes anyway,
# and on anything better this preserves the layout.
audio-channels=auto-safe


# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------

# Remember playback position on quit.
save-position-on-quit=yes

# Generous demuxer buffer. Cheap in RAM on this host, and it covers both network
# sources and the spinning-rust case without stalling mid-scene.
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB

# PNG rather than the JPEG default, at full bit depth -- a screenshot taken to
# compare encode quality is worthless if the screenshot itself is lossy.
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory=~/Pictures/mpv


# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------

# For external displays on the RX 580 eGPU, which is not power-clamped and has
# the headroom the internal panel does not. Adds the interpolation the top-level
# config leaves off, and the tscale that makes it behave.
#
#   mpv --profile=smooth <file>
#
# Also moves decode to the eGPU, for the same reason the top-level setting keeps
# it on the Baffin: decode where the display is. 80:00.0 is the RX 580.
#
# This path only exists while the eGPU is attached -- it is Thunderbolt, so an
# unplugged run will fail here rather than fall back. That is the intended
# behaviour for a profile you invoke by name; the default config above stays
# correct with or without the eGPU.
[smooth]
interpolation=yes
tscale=oversample
vaapi-device=/dev/dri/by-path/pci-0000:80:00.0-render

# The escape hatch. Everything expensive off, software-decode-safe, for when a
# driver upgrade breaks Vulkan or a file trips a codec the fixed function block
# cannot handle.
#
# What Polaris actually decodes in hardware, read from `vainfo` on this host
# rather than from the UVD version number:
#
#   H.264   ConstrainedBaseline, Main, High
#   HEVC    Main AND Main10 -- 10-bit is present, contrary to the common claim
#           that Polaris is 8-bit only
#   Plus    MPEG2, VC-1, JPEG
#
# The real gaps are VP9 and AV1: neither has a VAEntrypointVLD at all here, so
# those decode on the CPU no matter what hwdec says. That is the case this
# profile exists for, not 10-bit HEVC.
#
#   mpv --profile=lite <file>
[lite]
vo=gpu
gpu-api=opengl
hwdec=no
scale=bilinear
cscale=bilinear
dscale=bilinear
deband=no
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
video-sync=audio
