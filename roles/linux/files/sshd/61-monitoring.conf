# Adds a SECOND authorized-keys file, for the health-signal monitoring key only
# (specs/linux-migration Task 10, REQ-E1.6). Managed by roles/linux; installed to
# /etc/ssh/sshd_config.d/61-monitoring.conf.
#
# WHY A SEPARATE FILE rather than appending to ~/.ssh/authorized_keys:
#
# That file is this machine's lifeline -- it holds the key you actually log in
# with, and it is not managed by this repo (undeclared host state, deliberately
# left alone). Bringing it under Ansible just to add a monitoring key would mean
# a bug in a template could lock you out of a headless server. A separate,
# repo-owned file fails safe instead: if it is malformed or empty, the monitoring
# poll breaks and normal access is untouched.
#
# It also keeps the trust boundary legible. The monitoring credential is
# lower-trust than a login credential by nature -- it sits unattended on the
# runner machine so it can fire without a human present -- and keeping it in its
# own file means "what can the monitor do" is answerable by reading one short
# file rather than auditing a mixed list.
#
# ORDERING: the main sshd_config ships AuthorizedKeysFile commented out, and
# sshd takes the FIRST value it obtains for a keyword. Ubuntu's Include of
# sshd_config.d/ sits near the top of sshd_config, so this drop-in is read before
# the commented default and wins. Verify with `sudo sshd -T | grep -i
# authorizedkeysfile` rather than assuming -- a typo here silently reverts to the
# default and the monitor stops authenticating.
#
# The default value is restated explicitly because this directive REPLACES the
# default rather than adding to it. Omitting .ssh/authorized_keys here would lock
# out the login key.
AuthorizedKeysFile	.ssh/authorized_keys .ssh/authorized_keys.monitoring
