# Wires remote LUKS unlock into every initrd this host builds
# (specs/linux-migration Task 8). Managed by roles/linux; installed to
# /etc/dracut.conf.d/60-remote-unlock.conf.
#
# dracut's += syntax appends to whatever the defaults and other drop-ins set,
# and REQUIRES the leading and trailing space inside the quotes -- without them
# the values run together with their neighbours and silently produce a module
# name that does not exist.

# network            supplies the initrd's ip= handling (dracut-network package).
# dropbear-unlock    this repo's module; see
#                    roles/linux/files/dracut/dropbear-unlock/module-setup.sh.
add_dracutmodules+=" network dropbear-unlock "

# The unlock NIC, declared rather than left to dracut's host-only detection.
# Host-only picks up what happens to be bound at build time, which would make a
# rebuild performed with the adapter unplugged silently produce an initrd that
# can never reach the network.
#
#   xhci_pci  The USB host controller. On this Mac every USB-C port is served by
#             the Thunderbolt chip's integrated xHCI (JHL7540), so this is the
#             controller the adapter hangs off. No thunderbolt module is needed:
#             that path is a permanent PCIe device, not a tunnel to the eGPU
#             enclosure.
#   r8152     The Realtek USB gigabit adapter plugged directly into the Mac.
#             Its own deps (usbnet, mii) are resolved by dracut.
#
# The host's OTHER gigabit adapter (ax88179_178a) lives inside the Razer Core,
# behind the Thunderbolt PCIe tunnel, and is deliberately NOT the unlock path:
# using it would make booting this machine depend on the eGPU enclosure being
# powered on.
add_drivers+=" xhci_pci r8152 "

# Embedded into the initrd as /etc/cmdline.d/, NOT added to GRUB.
#
# This is deliberate and it matters for sequencing. Declaring
# GRUB_CMDLINE_LINUX_DEFAULT in this repo is a follow-up that is supposed to
# land AFTER Task 8, so that remote unlock exists as a recovery path before we
# start editing the boot loader on a machine that already carries a
# GRUB-vs-Startup-Manager caveat. Routing these two parameters through dracut
# instead of GRUB keeps that order intact.
#
#   rd.neednet=1  Without it dracut only configures networking when the ROOT
#                 device needs it (NFS, iSCSI). Local-disk root means no
#                 network, and dropbear would start on a host with no address.
#   ip=dhcp       Address from the router's DHCP reservation, so no LAN address
#                 is committed to this repo (REQ-F1.1). No interface is named:
#                 dracut tries each in turn, and naming one would mean writing
#                 this host's MAC into a public repo, since the adapter's
#                 predictable name (enx<MAC>) is derived from it.
kernel_cmdline+=" rd.neednet=1 ip=dhcp "
