# Managed by Ansible (roles/linux/files/logind/). Do not edit on the host.
#
# This machine is an always-on server that happens to be a laptop
# (specs/linux-migration). Closing the lid must never take it down, with or
# without an external display attached, because the normal steady state is
# "lid shut, no monitor, reached over SSH or Tailscale".
#
# All three lid settings are pinned, not just the docked one. systemd's default
# is HandleLidSwitchDocked=ignore but HandleLidSwitch=suspend, and "docked" is
# inferred from a docking station or a second connected display -- which here
# means an eGPU-driven monitor over Thunderbolt. That inference is exactly the
# thing that goes away when the eGPU is unplugged, asleep, or enumerated late
# after a reboot, and the fallback is the suspending default. Naming all three
# removes the inference from the path entirely.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# Belt and braces: the default is already ignore, but an idle timeout that
# suspends a headless server is unrecoverable without physical access, so it is
# asserted rather than inherited.
IdleAction=ignore
