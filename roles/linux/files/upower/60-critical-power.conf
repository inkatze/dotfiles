# Managed by the dotfiles linux role -- do not edit by hand; the next playbook
# run overwrites this file. Source: roles/linux/files/upower/.
#
# UPower's shipped CriticalPowerAction is HybridSleep, which cannot work on this
# host. Three independent reasons, any one of which is fatal:
#
#   - hybrid-sleep.target is masked to /dev/null. power.yml unmasks
#     sleep.target, suspend.target and hibernate.target, but not this one.
#   - The kernel cmdline carries no resume=, so nothing could resume an image
#     even if one were written.
#   - The swap file is 8 GB against 32 GB of RAM, which an image has to fit.
#
# So the action fails and the machine runs to hardware cutoff, taking an
# UNCLEAN shutdown on every outage that outlasts the battery. Found 2026-07-29
# while verifying REQ-E1.4; it predates that test, being what the host shipped
# with rather than anything the test changed.
#
# PowerOff requires AllowRiskyCriticalPowerAction, which UPower demands for any
# action that can discard unsaved work. On a headless server that is the right
# trade: nothing here holds unsaved GUI state, and a clean shutdown protects the
# LUKS/ext4 root that a hard cut endangers.
#
# Recovery cost is identical either way, which is what makes this free. This is
# a MacBook, and notebooks implement no "start up automatically after a power
# failure" mechanism (a desktop-Mac feature), so an outage outlasting the
# battery ends in a manual power-on whether the shutdown was clean or not.
#
# Deliberately a drop-in rather than an edit to /etc/UPower/UPower.conf: UPower
# 1.91 reads UPower.conf.d/, later files win on matching Group and Key, and the
# package keeps ownership of its own defaults. The filename must match
# ^[0-9][0-9]-[a-zA-Z0-9-_]*\.conf$ or UPower ignores the file silently.
[UPower]
CriticalPowerAction=PowerOff
AllowRiskyCriticalPowerAction=true
