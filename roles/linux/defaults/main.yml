---

# Baseline apt packages for the Linux platform (specs/linux-migration, D-5).
#
# Goal: the shell on this host should feel like the `personal` Mac. The
# grouping below mirrors Brewfile's, so a tool added there has an obvious home
# here. mise, Tailscale, and the 1Password CLI have their own repo-backed
# install task files; language runtimes come from mise
# (roles/environments/files/mise.toml), not apt.
#
# apt is the default here and mise is the exception: apt packages are patched
# by unattended-upgrades, mise-managed ones are not, which matters on a host
# that is becoming always-on. The short list of tools that earned a move to
# user-level mise lives in linux_mise_tools below.
linux_apt_packages:
  # Core utilities
  - ack
  - ca-certificates
  - curl
  - fd-find
  - fzf
  - gnupg
  - htop
  - make
  - ripgrep
  - silversearcher-ag  # ships /usr/bin/ag, used by FZF_DEFAULT_COMMAND
  - tree
  - unzip
  - wget

  # Shell
  - fish
  - starship

  # Terminal
  - tmux
  - urlview

  # Git
  - git
  - git-extras
  - lazygit

  # Development dependencies
  - build-essential
  - libsodium-dev
  - llvm
  - mkcert
  - xsltproc           # Linux equivalent of the libxslt CLI

  # Misc tools
  - ddgr
  - direnv
  - jq
  - mosh
  - nnn
  - redis-tools

  # Server baseline
  - openssh-server

# User-level tools installed by mise instead of apt, declared in
# roles/linux/files/mise/linux.toml (which carries the pinned versions and the
# per-tool reasoning). Order matters: the pipx backend needs `uv` on PATH, so
# uv is installed first.
linux_mise_tools:
  - uv
  - pipx:ansible-core
  - pipx:ansible-lint
  - gh

# Absolute path to the user-level mise binary. The tasks below shell out to it
# directly rather than relying on PATH, because on a fresh host mise has just
# been installed into ~/.local/bin and the ansible process' PATH predates it.
linux_mise_bin: "{{ ansible_env.HOME }}/.local/bin/mise"

# Where the Linux-only mise config is materialized. mise reads every *.toml
# under ~/.config/mise/conf.d as global config, alongside ~/.config/mise.toml
# (which the environments role owns), so the two do not collide.
linux_mise_conf_d: "{{ ansible_env.HOME }}/.config/mise/conf.d"

# Deliberately NOT in this list, so the omissions read as decisions rather than
# oversights:
#
# - Containers (colima, docker, docker-compose from Brewfile.personal):
#   specs/linux-migration lists container/service deployment as Out of scope;
#   future specs own it. colima is macOS-specific anyway — a Lima VM standing
#   in for the native Linux containers this host would use.
# - Databases (mariadb, mysql, postgresql): long-running services, same
#   Out-of-scope clause.
# - GUI casks (chrome, steam, zoom, transmission, dbeaver, cyberduck): a
#   separate call, and this host is heading toward headless server duty.
# - macOS-only Brewfile entries with no Linux meaning: pinentry-mac, pngpaste,
#   terminal-notifier, mas; plus gnu-tar and readline, since the GNU userland
#   is native here.
# - stylua, lua-language-server: not packaged in Ubuntu. Install via mise if
#   the Neovim Lua setup needs them on this host.
#
# Considered for the move to mise and deliberately KEPT in apt, with the
# archive version measured on resolute against the current upstream release:
#
# - ripgrep (15.1.0 vs 15.2.0), jq (1.8.1 vs 1.8.2), mkcert (1.4.4, identical),
#   direnv (2.37.1, identical): apt is already at or within a patch of
#   upstream. Nothing to gain, and unattended-upgrades to lose.
# - fd-find (10.3.0) and its ~/.local/bin/fd shim: mise would supply the real
#   binary name and let the shim task go, but fd is exactly the small, stable,
#   current utility apt handles well. The shim already works; it stays.
# - fzf (0.67.0), lazygit (0.57.0): behind upstream but fully functional TUIs,
#   with no feature this setup depends on. Not worth leaving the patch stream.
# - starship (1.22.1), direnv: hard blocker on top of the above — config.fish
#   runs `starship init` and `direnv hook` BEFORE `mise activate fish`, so
#   neither can live behind mise activation without reordering that file
#   (owned by another change).
# - tmux (3.6a): the session host you reattach to over SSH on an always-on
#   box. Its availability must not depend on a shell hook having run, and it
#   is close enough to upstream 3.7b to make the trade pointless.
# - silversearcher-ag: verified failure, not a judgement call — mise's only
#   backend is vfox:mise-plugins/vfox-ag, which builds from source and dies at
#   `./autogen.sh: aclocal: not found`. It would need autotools via apt to
#   avoid apt.
# - make: build-essential already depends on it, and mise's only backend is
#   conda, an inappropriate dependency for a core build tool.

# sshd hardening drop-in filename (REQ-E1.1: key-only auth, no root login).
linux_ssh_hardening_dropin: 60-hardening.conf
