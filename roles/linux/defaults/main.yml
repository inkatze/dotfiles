---

# Baseline apt packages for the Linux platform (specs/linux-migration, D-5).
#
# Goal: the shell on this host should feel like the `personal` Mac. The
# grouping below mirrors Brewfile's, so a tool added there has an obvious home
# here. mise, Tailscale, and the 1Password CLI have their own repo-backed
# install task files; language runtimes come from mise
# (roles/environments/files/mise.toml), not apt.
#
# apt is the default here and mise is the exception: apt packages are patched
# by unattended-upgrades, mise-managed ones are not, which matters on a host
# that is becoming always-on. The short list of tools that earned a move to
# user-level mise lives in linux_mise_tools below.
linux_apt_packages:
  # Core utilities
  - ack
  - ca-certificates
  - curl
  - fd-find
  - fzf
  - gnupg
  - htop
  - make
  - ripgrep
  - silversearcher-ag  # ships /usr/bin/ag, used by FZF_DEFAULT_COMMAND
  - tree
  - unzip
  - wget

  # Shell
  - fish
  - starship

  # Terminal
  - tmux
  - urlview
  # roles/kitty is cross-platform and already symlinks ~/.config/kitty here, so
  # before this line the host carried config for a program it did not have.
  # Only matters at the physical console: reached over `kitten ssh` from a Mac,
  # the Mac renders and this is unused.
  - kitty
  # fc-cache, for the Nerd Font install in tasks/fonts.yml. kitty pulls it in
  # transitively, but the font task must not depend on that ordering.
  - fontconfig

  # Git
  - git
  - git-extras
  - lazygit

  # Development dependencies
  - build-essential
  - libsodium-dev
  - llvm
  - mkcert
  - xsltproc           # Linux equivalent of the libxslt CLI
  # Headers for the mise toolchains that build from source. macOS gets these
  # transitively through Homebrew; on apt the runtime libs ship separately from
  # their -dev headers, so a source build fails without them. The first three
  # are observed failures on this host, not precaution:
  #   libyaml-dev    ruby 3.4.2 -- psych could not configure ("fatal error:
  #                  yaml.h: No such file or directory"); ruby-build then fails
  #                  the whole build because --with-ext lists psych explicitly.
  #                  libyaml-0-2 (runtime) was already present; only the
  #                  headers were missing.
  #   libreadline-dev  lua 5.1.5 -- src/lua.c includes <readline/readline.h>
  #                  and make dies at lua.o.
  #   libssl-dev     erlang 28.3 -- OTP's configure probes for this package by
  #                  name, does not find the headers, and skips the crypto, ssl
  #                  AND ssh applications. Same runtime-vs-headers split as
  #                  libyaml above: libssl3t64 was already installed.
  #
  #                  Worse than the two above, because it is not a build
  #                  failure. configure emits "WARNING: No (usable) OpenSSL
  #                  found, skipping ssl, ssh and crypto applications" and the
  #                  build then reports SUCCESS. mise installs a working-looking
  #                  erlang whose crypto module simply does not exist, and the
  #                  breakage surfaces much later as crypto:strong_rand_bytes/1
  #                  raising undef -- no TLS listener, no hex fetch, and every
  #                  Elixir project on the host inherits it.
  #
  #                  This line previously read "libssl-dev is deliberately
  #                  absent: mise's ruby-build downloads and builds its own
  #                  OpenSSL into the ruby prefix, so ruby does not need the
  #                  system one." That is still true of ruby, and was the wrong
  #                  thing to generalise from -- ruby-build vendors OpenSSL,
  #                  erlang's configure does not. An absence justified by one
  #                  toolchain silently broke another.
  # The last two are pre-emptive: they are ruby extensions built under
  # --with-ext=...,+ so a missing header skips them SILENTLY rather than
  # failing, surfacing much later as a gem that will not install.
  #   libffi-dev     fiddle, and the many gems that link libffi
  #   libgmp-dev     bignum acceleration
  - libyaml-dev
  - libreadline-dev
  - libssl-dev
  - libffi-dev
  - libgmp-dev

  # GPU / Vulkan (specs/linux-migration Task 9, the RX 580 eGPU)
  #
  # Baseline rather than a one-off install: this host has a discrete GPU, and a
  # GPU box that silently cannot do Vulkan is a trap. Nothing here is a service
  # or a daemon, so nothing here needs the install/enable/start/verify lifecycle
  # the `services` role drives, and it belongs in this package list rather than
  # in that role's declaration.
  #
  #   mesa-vulkan-drivers  RADV, Mesa's Vulkan driver. This is the actual
  #                        driver: without it the machine has no Vulkan at all
  #                        (verified -- radeon_icd.json was absent), even though
  #                        amdgpu binds the card and drives a display.
  #   vulkan-tools         vulkaninfo, for enumeration and device attribution.
  #
  # NOT installed: vulkan-validationlayers, developer tooling for people writing
  # Vulkan code rather than running it.
  #
  # The :i386 variant IS installed, in the Gaming block below. This comment used
  # to exclude it on the grounds that it was "needed only for Steam/wine, and
  # this host is heading for headless duty" -- both halves of which stopped
  # being true when Steam was added.
  - mesa-vulkan-drivers
  - vulkan-tools

  # Task 9 requires a Vulkan *compute* workload run to completion with the eGPU
  # attributed in the tool's own output. llama.cpp is the chosen vehicle: it is
  # packaged (so no vendored build), its ggml Vulkan backend prints the device
  # it selected, and it exercises real compute rather than a graphics scene the
  # way vkmark or vkcube would.
  #
  # Polaris-safe, which the task explicitly calls for ("no FP16-dependent
  # backend"): GCN 4 has no fast FP16, and llama.cpp's Vulkan backend runs the
  # FP32 paths on such devices rather than requiring shaderFloat16. Both claims
  # are now measured rather than assumed -- ggml reports "fp16: 0" for both
  # Polaris devices on this host and benchmarks to completion anyway, naming the
  # eGPU in its own output. See the Task 9 section of
  # specs/linux-migration/runbook.md.
  - libggml0-backend-vulkan
  - llama.cpp-tools

  # Gaming
  #
  # Steam is a deliberate exception to the "GUI apps are a separate call"
  # omission below, which it amends rather than contradicts: this host has an
  # 8 GB RX 580 attached, and occasional gaming is a use the hardware is already
  # paying for. It is not a service and starts nothing at boot, so it needs no
  # unit management and stays a package in this list.
  #
  #   steam-installer      the amd64 bootstrap; it pulls steam:i386 and
  #                        steam-libs-i386:i386 in turn. Steam's runtime is
  #                        still 32-bit, which is the whole reason the i386
  #                        architecture has to be enabled in tasks/main.yml
  #                        BEFORE the apt cache is refreshed.
  #   mesa-vulkan-drivers:i386  RADV for 32-bit clients. Without it, Proton and
  #                        native 32-bit titles fall back to software rendering
  #                        or refuse to start, on a machine that demonstrably
  #                        does Vulkan fine at 64-bit -- a confusing failure.
  - steam-installer
  - mesa-vulkan-drivers:i386

  # Media
  #
  # Takes ownership of three undeclared manual installs: mpv, ffmpeg and vainfo
  # were all present on this host and marked manual by apt, while
  # roles/linux/tasks/media.yml claimed in a comment that they lived here. They
  # did not. That file also went unwired, so the mpv configuration it symlinks
  # was in place only because the symlink had been made by hand.
  #
  #   mpv        The player the repo-managed config in files/mpv/ is written
  #              for.
  #   celluloid  GTK frontend over libmpv, so the same tuning applies with a GUI.
  #              NOT previously installed, despite media.yml existing to
  #              configure it, which is the gap that made the whole file dead.
  #   ffmpeg     Not needed by mpv itself (it links the libav* libraries, not the
  #              CLI), but the CLI is what inspects a file when playback looks
  #              wrong, which is the situation the config's comments send you to.
  #   vainfo     Named directly by files/mpv/mpv.conf as the way to verify
  #              hardware decode ("Verify with `vainfo`"). A troubleshooting
  #              instruction that assumes an undeclared package is a trap.
  - mpv
  - celluloid
  - ffmpeg
  - vainfo

  # Misc tools
  - ddgr
  - direnv
  - jq
  - mosh
  - nnn
  # The client half only. The Valkey server it talks to is not in this list:
  # it is declared in roles/services/defaults/main.yml, per the databases and
  # caches note at the bottom of this file.
  - redis-tools

  # Server baseline
  - openssh-server

  # Remote LUKS unlock (Task 8, REQ-B1.7)
  #
  # NOT dropbear-initramfs, which is the package every guide names. That is an
  # initramfs-tools package and this host builds its initrd with dracut, so its
  # hooks would never be read: it installs cleanly, reports success, and does
  # nothing at boot. The dracut glue is hand-written instead, under
  # roles/linux/files/dracut/dropbear-unlock/, and pulls in only these two:
  #
  #   dropbear-bin    The SSH server binary and dropbearkey. Taken from apt on
  #                   purpose -- it is the network-facing half, so it belongs on
  #                   the unattended-upgrades patch stream. Only the ~60 lines
  #                   of dracut glue are ours.
  #   dracut-network  Supplies dracut's `network` module, without which the
  #                   initrd has no ip= handling and dropbear would start on a
  #                   host with no address.
  - dropbear-bin
  - dracut-network

# apt packages that must NOT be present, because a user-level install owns the
# tool instead. Declared rather than left to chance: apt's gh was installed on
# this host manually, so both it and the mise one existed at once — and since
# git runs credential helpers through `sh`, which may not carry mise's PATH, the
# bare name resolved to apt's OLDER binary. linux.toml moved gh to mise
# precisely because apt's is two years stale and gh is "a credential-holding
# network client"; leaving the apt copy installed quietly undid that.
linux_apt_packages_absent:
  - gh

# User-level tools installed by mise instead of apt, declared in
# roles/linux/files/mise/linux.toml (which carries the pinned versions and the
# per-tool reasoning). Order matters: the pipx backend needs `uv` on PATH, so
# uv is installed first.
linux_mise_tools:
  - uv
  - pipx:ansible-core
  - pipx:ansible-lint
  - gh
  - lua-language-server

# Absolute path to the user-level mise binary. The tasks below shell out to it
# directly rather than relying on PATH, because on a fresh host mise has just
# been installed into ~/.local/bin and the ansible process' PATH predates it.
linux_mise_bin: "{{ ansible_facts.env.HOME }}/.local/bin/mise"

# Where the Linux-only mise config is materialized. mise reads every *.toml
# under ~/.config/mise/conf.d as global config, alongside ~/.config/mise.toml
# (which the environments role owns), so the two do not collide.
linux_mise_conf_d: "{{ ansible_facts.env.HOME }}/.config/mise/conf.d"

# Deliberately NOT in this list, so the omissions read as decisions rather than
# oversights:
#
# - Containers (colima, docker, docker-compose from Brewfile.personal): no
#   bundle owns them yet. specs/linux-migration deferred container deployment,
#   and specs/dev-services declined a container runtime none of its services
#   needed. colima is macOS-specific anyway — a Lima VM standing in for the
#   native Linux containers this host would use.
# - Databases and caches (postgresql, valkey-server, mariadb, mysql): the
#   first two are no longer omitted on scope grounds. specs/dev-services
#   declares PostgreSQL and Valkey, and the `services` role installs, enables,
#   starts and verifies them from roles/services/defaults/main.yml. They stay
#   absent from this list because that role owns their whole lifecycle, not
#   because the host does not run them. mariadb and mysql are absent for a
#   different reason: nothing declares them, and the Brewfile entries are the
#   Macs' own.
# - GUI casks (chrome, zoom, transmission, dbeaver, cyberduck): a separate
#   call, and this host is heading toward headless server duty. steam was on
#   this list until the eGPU landed and made gaming a real use of hardware the
#   host already has; it now sits in the Gaming block above. The rest stay out
#   for the original reason, so this remains a decision rather than an
#   oversight.
# - macOS-only Brewfile entries with no Linux meaning: pinentry-mac, pngpaste,
#   terminal-notifier, mas; plus gnu-tar and readline, since the GNU userland
#   is native here.
# - stylua: not packaged in Ubuntu, and not needed. It appears in the Neovim
#   config only as a root-marker FILENAME (.stylua.toml in lspconfig/lua.lua's
#   root_markers); nothing ever executes the binary, so its absence is inert.
#   This line used to lump it together with lua-language-server under "install
#   via mise if the Neovim Lua setup needs them" -- the two turned out to have
#   opposite answers, which is why they are now separated.
#
# Considered for the move to mise and deliberately KEPT in apt, with the
# archive version measured on resolute against the current upstream release:
#
# - ripgrep (15.1.0 vs 15.2.0), jq (1.8.1 vs 1.8.2), mkcert (1.4.4, identical),
#   direnv (2.37.1, identical): apt is already at or within a patch of
#   upstream. Nothing to gain, and unattended-upgrades to lose.
# - fd-find (10.3.0) and its ~/.local/bin/fd shim: mise would supply the real
#   binary name and let the shim task go, but fd is exactly the small, stable,
#   current utility apt handles well. The shim already works; it stays.
# - fzf (0.67.0), lazygit (0.57.0): behind upstream but fully functional TUIs,
#   with no feature this setup depends on. Not worth leaving the patch stream.
# - starship (1.22.1), direnv: hard blocker on top of the above — config.fish
#   runs `starship init` and `direnv hook` BEFORE `mise activate fish`, so
#   neither can live behind mise activation without reordering that file
#   (owned by another change).
# - tmux (3.6a): the session host you reattach to over SSH on an always-on
#   box. Its availability must not depend on a shell hook having run, and it
#   is close enough to upstream 3.7b to make the trade pointless.
# - silversearcher-ag: verified failure, not a judgement call — mise's only
#   backend is vfox:mise-plugins/vfox-ag, which builds from source and dies at
#   `./autogen.sh: aclocal: not found`. It would need autotools via apt to
#   avoid apt.
# - make: build-essential already depends on it, and mise's only backend is
#   conda, an inappropriate dependency for a core build tool.

# sshd hardening drop-in filename (REQ-E1.1: key-only auth, no root login).
linux_ssh_hardening_dropin: 60-hardening.conf

# Health signal (Task 10, REQ-E1.6). The runner is the `work` Mac, which polls
# over SSH and pushes alerts; this host contributes only the two things below and
# nothing that runs on its own, which is what preserves the spec's no-services
# scope.
#
# The sshd drop-in adds a SECOND authorized-keys file so the monitoring key never
# touches ~/.ssh/authorized_keys -- that file is the login lifeline into a
# headless server and is deliberately not repo-managed. See the drop-in's header.
linux_ssh_monitoring_dropin: 61-monitoring.conf
linux_health_report_bin: /usr/local/bin/dotfiles-health-report

# Remote LUKS unlock (Task 8, REQ-B1.7).
#
# The /etc/dropbear/initramfs/ path mirrors the layout the packaged
# dropbear-initramfs would have used. Kept on purpose even though that package
# is not installed here: it is the path every piece of documentation on the
# subject refers to, so matching it costs nothing and saves a future reader from
# wondering whether this host is doing something exotic.
linux_dropbear_dir: /etc/dropbear/initramfs
linux_dropbear_host_key: "{{ linux_dropbear_dir }}/dropbear_ed25519_host_key"

# The numeric prefix is dracut's module ordering. 60 puts this ahead of 70crypt,
# so the module is set up before the crypt module that will be waiting on the
# passphrase it exists to deliver.
linux_dracut_module_dir: /usr/lib/dracut/modules.d/60dropbear-unlock
linux_dracut_unlock_conf: 60-remote-unlock.conf

# udev rule that pins the INTERNAL Radeon Pro to its lowest power state for
# thermal headroom, while deliberately leaving the RX 580 eGPU alone. Replaces a
# hand-written rule that matched by card NUMBER and therefore clamped the eGPU
# too; the reasoning and the measured cost are in the source file's header.
linux_amdgpu_pm_rule: 30-amdgpu-pm.rules

# Sleep targets that were masked to /dev/null by hand on 2026-07-24, and are
# unmasked again now that the logind drop-in below declares lid and idle policy
# properly. Masking is a blunt instrument: it makes suspend IMPOSSIBLE rather
# than unrequested, so a deliberate `systemctl suspend` fails too, and nothing in
# the repo explained why.
#
# Safe because nothing on this host asks to suspend any more, verified live
# rather than assumed:
#   logind  HandleLidSwitch / ExternalPower / Docked / IdleAction  = ignore
#           (read from the org.freedesktop.login1 Manager interface, not from
#            `systemctl show`, which does not expose logind's config as unit
#            properties and returns blanks that look like unset values)
#   GNOME   sleep-inactive-ac-type = 'nothing'
#
# hybrid-sleep.target is deliberately NOT in this list, and its absence used to
# look like an oversight. Hibernation is not functional on this host -- the
# kernel cmdline carries no resume=, and the 8 GB swap file could not hold an
# image of 32 GB of RAM -- so unmasking it would only convert a fast, honest
# failure into a slow one that writes an unresumable image first. Leaving it
# masked is the accurate statement of what the machine can do. That is also why
# UPower's default CriticalPowerAction had to change; see
# linux_upower_critical_dropin below.
linux_unmask_sleep_targets:
  - sleep.target
  - suspend.target
  - hibernate.target

# systemd-logind drop-in that stops a closed lid or an idle timeout from
# suspending this host. It is a laptop serving as an always-on server, so the
# steady state is lid shut and headless.
linux_logind_lid_dropin: 60-lid.conf

# UPower drop-in replacing the shipped CriticalPowerAction=HybridSleep, which
# targets the one sleep target still masked above and so always failed, leaving
# the host to run to hardware cutoff on any outage outlasting the battery. The
# file itself carries the full reasoning.
linux_upower_critical_dropin: 60-critical-power.conf

# NetworkManager drop-in marking the Apple T2 coprocessor's NCM link unmanaged.
# Without it that link looks like a live wire, so NM runs DHCP on it forever:
# 27 failed activations in one boot, every 6 m 30 s. The file carries the full
# reasoning, including why this is fixed at the device and not the profile.
linux_nm_unmanaged_dropin: 60-unmanaged-devices.conf
# Variables for tasks/media.yml. Absent until now, which is why that file had
# never run: nothing included it, and it would have failed on its first task if
# anything had.
linux_mpv_config_dir: "{{ ansible_facts.env.HOME }}/.config/mpv"

# Celluloid runs libmpv with stock defaults unless told otherwise, so pointing
# it at the repo-managed mpv.conf is what makes the scaling, dithering and
# debanding work there as well as in bare mpv.
#
# Schema id read out of the package rather than guessed (`dpkg-deb -x` on
# celluloid 0.29-3, then the gschema in usr/share/glib-2.0/schemas): note the
# capital C in Celluloid against the lowercase hyphenated celluloid-player, an
# asymmetry that is easy to get wrong and fails silently, because media.yml
# tolerates a failed `gsettings get` and then skips the set.
linux_celluloid_schema: io.github.celluloid-player.Celluloid

# A URI, NOT a path. Celluloid feeds this key to g_file_new_for_uri, and before
# 0.26 a plain path there crashed the app on startup rather than being ignored
# (celluloid-player/celluloid#1093). 0.29 no longer crashes, but a path is still
# not honoured, so the file:// prefix is load-bearing.
linux_mpv_config_uri: "file://{{ linux_mpv_config_dir }}/mpv.conf"

# expect carries the surrounding single quotes because `gsettings get` prints
# string values quoted, while `gsettings set` takes them bare. Comparing the raw
# stdout against an unquoted value would report a difference on every run and
# never converge to changed=0.
linux_celluloid_mpv_settings:
  - key: mpv-config-enable
    set: "true"
    expect: "true"
  - key: mpv-config-file
    set: "{{ linux_mpv_config_uri }}"
    expect: "'{{ linux_mpv_config_uri }}'"

# FiraCode Nerd Font, the face roles/kitty/files/kitty/kitty.conf asks for by
# name ("FiraCode Nerd Font Mono"). The Macs get it from the Brewfile cask
# font-fira-code-nerd-font; apt has no Nerd Font at all (fonts-firacode is
# stock FiraCode with none of the patched glyphs), so this is one of the few
# places the apt-first rule cannot be honoured and an upstream release is
# fetched directly.
#
# Pinned, like the mise tools and for the same reason: a font fetched from a
# GitHub release is invisible to unattended-upgrades, so moving it has to be a
# reviewable commit rather than a silent change under the terminal.
#
# Installed user-level under ~/.local/share/fonts, so no root and no collision
# with the distro's /usr/share/fonts tree.
linux_nerd_font_version: v3.4.0
linux_nerd_font_archive: FiraCode.zip
linux_nerd_font_dir: "{{ ansible_facts.env.HOME }}/.local/share/fonts/FiraCodeNerdFont"
# A file known to exist inside the archive, used as the idempotency guard. It
# must stay correct: a wrong name here re-downloads 27 MB on every single run
# and the playbook could never report changed=0.
linux_nerd_font_probe: FiraCodeNerdFontMono-Regular.ttf
