---

- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted
  become: true

# User-scoped: fontconfig keeps a per-user cache under ~/.cache/fontconfig, and
# the fonts themselves live under ~/.local/share/fonts, so no become.
- name: Refresh the font cache
  ansible.builtin.command:
    cmd: fc-cache -f {{ linux_nerd_font_dir | quote }}
  changed_when: true

# This host builds its initrd with dracut, NOT initramfs-tools -- see
# roles/linux/files/dracut/dropbear-unlock/module-setup.sh for why that
# distinction matters. `update-initramfs` here is only a compatibility shim
# owned by the dracut package, so dracut is called directly to keep the
# mechanism visible in the playbook output.
#
# Current kernel only, deliberately. `--regenerate-all` would also rebuild the
# stock 7.0.0-generic image, which cannot boot this T2 Mac anyway, and a failure
# there would fail the play for no gain. New kernels pick this configuration up
# on their own through dracut's /usr/lib/kernel/install.d/ hook.
#
# The new image replaces the one in /boot immediately, but only takes effect at
# the next boot -- so verify with `lsinitrd` BEFORE rebooting. See the Task 8
# section of specs/linux-migration/runbook.md.
# Re-reads the rules for devices that appear LATER. It deliberately does not
# `udevadm trigger`, which would re-run rules against the GPU currently driving
# the display; the already-wrong value on an existing device is corrected
# directly in power.yml instead.
- name: Reload udev rules
  ansible.builtin.command:
    cmd: udevadm control --reload
  become: true
  changed_when: true

# A restart, not a reload: `systemctl show upower -p ExecReload` is empty, so
# there is no reload path and the daemon re-reads its configuration only at
# start. Safe to restart here, unlike systemd-logind (see the comment in
# power.yml): upower serves power state over D-Bus and owns no login sessions,
# so nothing running on the host is torn down with it.
- name: Restart upower
  ansible.builtin.service:
    name: upower
    state: restarted
  become: true

# Reload, NOT restart. NetworkManager does have an ExecReload (it calls the
# Reload method over D-Bus), and reloading re-reads conf.d without tearing down
# active devices -- which matters because this host is headless and reached over
# the network, so a restart would drop the session applying the change.
#
# Marking a device unmanaged does deactivate that device specifically, but
# t2_ncm carries no working connection to lose; that is the entire problem being
# fixed.
- name: Reload NetworkManager
  ansible.builtin.service:
    name: NetworkManager
    state: reloaded
  become: true

- name: Regenerate the initramfs
  ansible.builtin.command:
    cmd: dracut --force
  become: true
  changed_when: true
