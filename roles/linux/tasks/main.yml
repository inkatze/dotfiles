---

# Steam's runtime is still 32-bit, so i386 has to be enabled before the cache
# refresh below. `dpkg --add-architecture` only records that the architecture
# exists; the i386 package lists are not fetched until the next apt update, so
# doing this in the other order leaves steam-installer's steam-libs-i386:i386
# dependency unresolvable on a fresh host.
- name: Check the enabled dpkg architectures
  ansible.builtin.command:
    cmd: dpkg --print-foreign-architectures
  register: linux_foreign_arches
  changed_when: false
  tags: [linux]

- name: Enable the i386 architecture for Steam
  ansible.builtin.command:
    cmd: dpkg --add-architecture i386
  become: true
  when: "'i386' not in linux_foreign_arches.stdout_lines"
  register: linux_i386_enabled
  changed_when: true
  tags: [linux]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    # Forced when i386 was just enabled: the cached lists predate the new
    # architecture and contain no i386 package at all, so honouring the usual
    # hour-long validity window here would defer every i386 install to the
    # next run.
    cache_valid_time: "{{ (0 if linux_i386_enabled.changed else 3600) | int }}"
  become: true
  tags: [linux]

# Removed rather than merely un-declared: an apt package that is present but
# unwanted still wins on a minimal PATH. See linux_apt_packages_absent.
- name: Remove apt packages superseded by user-level installs
  ansible.builtin.apt:
    name: "{{ linux_apt_packages_absent }}"
    state: absent
  become: true
  tags: [linux]

- name: Install baseline apt packages
  ansible.builtin.apt:
    name: "{{ linux_apt_packages }}"
    state: present
  become: true
  tags: [linux]

# Debian ships fd as `fdfind` (the `fd` binary name belongs to another
# package). Shim it so muscle memory from the Macs works unchanged.
# ~/.local/bin is already on PATH via config.fish's fish_add_path.
# User-scoped, so no become required.
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: "0755"
  tags: [linux]

- name: Shim fd to fdfind
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/fd"
    state: link
  tags: [linux]

- name: Install terminal fonts
  ansible.builtin.include_tasks: fonts.yml
  tags: [linux, fonts]

- name: Install mise runtime manager
  ansible.builtin.include_tasks: mise.yml
  tags: [linux]

- name: Configure OpenSSH server
  ansible.builtin.include_tasks: ssh-server.yml
  tags: [linux, ssh]

- name: Configure remote LUKS unlock
  ansible.builtin.include_tasks: remote-unlock.yml
  tags: [linux, unlock]

- name: Configure lid and idle power behaviour
  ansible.builtin.include_tasks: power.yml
  tags: [linux, power]

# After power.yml on purpose: the mpv configuration this deploys is written
# around the amdgpu power clamp that file applies, choosing which GPU decodes
# and leaving interpolation off for the clamped internal panel.
- name: Configure media playback
  ansible.builtin.include_tasks: media.yml
  tags: [linux, media]

- name: Configure NetworkManager device policy
  ansible.builtin.include_tasks: network.yml
  tags: [linux, network]

- name: Install Tailscale
  ansible.builtin.include_tasks: tailscale.yml
  tags: [linux]

- name: Install 1Password CLI
  ansible.builtin.include_tasks: onepassword.yml
  tags: [linux]
