---

# Lid and idle behaviour lives in a role-owned drop-in for the same reason the
# sshd hardening does: the effective config is asserted by the repo rather than
# hand-edited on the host.
#
# This replaces an undeclared manual change. sleep.target, suspend.target and
# hibernate.target were symlinked to /dev/null on the host on 2026-07-24, which
# does keep the machine up but is a blunt instrument -- it makes suspend
# impossible rather than unrequested, so a deliberate `systemctl suspend` fails
# too, and nothing in the repo explains why. Declaring the lid policy here means
# the masks can be lifted; see roles/linux/README.md.
# Unlike /etc/ssh/sshd_config.d/, this directory is not shipped by the Ubuntu
# package -- systemd reads it if present but does not create it, so the copy
# below would fail on a fresh host without this.
- name: Ensure the logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [linux, power]

- name: Deploy systemd-logind lid and idle drop-in
  ansible.builtin.copy:
    src: "logind/{{ linux_logind_lid_dropin }}"
    dest: "/etc/systemd/logind.conf.d/{{ linux_logind_lid_dropin }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [linux, power]

# Deliberately no handler to restart systemd-logind. It has no ExecReload
# (verified: `systemctl show systemd-logind -p ExecReload` is empty), so the
# only way to apply this live is a restart, and restarting logind tears down
# active sessions -- including the RDP or SSH session running the playbook.
# Lid policy is read at logind start, so the drop-in takes effect at next boot.
# To apply sooner, deliberately and from a console you are willing to lose:
#   sudo systemctl restart systemd-logind
- name: Report that the lid policy applies at next boot
  ansible.builtin.debug:
    msg: >-
      logind lid drop-in is in place. It takes effect at next boot; restarting
      systemd-logind now would end active login sessions.
  tags: [linux, power]

# Takes ownership of another undeclared manual change, and fixes a real bug in
# it: the hand-written rule matched GPUs by card NUMBER, which is unstable here,
# so it clamped the RX 580 eGPU to 300 MHz alongside the internal dGPU it was
# meant for. See the header of the source file for the full reasoning.
- name: Deploy the amdgpu power-management udev rule
  ansible.builtin.copy:
    src: "udev/{{ linux_amdgpu_pm_rule }}"
    dest: "/etc/udev/rules.d/{{ linux_amdgpu_pm_rule }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root
  notify: Reload udev rules
  tags: [linux, power]

# Reloading udev re-reads the rules but does not re-run them against devices
# that already exist, and nothing writes `auto` back, so a GPU already clamped
# this boot stays clamped. Rather than re-trigger drm devices (which pokes the
# GPU driving the display), the currently-wrong value is corrected directly.
#
# Scoped to the eGPU by device ID and guarded on the current value, so it is a
# no-op on every subsequent run -- which is what keeps `changed=0` reachable.
- name: Find amdgpu cards clamped against the corrected policy
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for c in /sys/class/drm/card*/device; do
        [ -e "$c/device" ] || continue
        [ "$(cat "$c/device")" = "0x67df" ] || continue
        lvl="$c/power_dpm_force_performance_level"
        [ -e "$lvl" ] || continue
        [ "$(cat "$lvl")" = "auto" ] && continue
        echo "$lvl"
      done
    executable: /bin/bash
  register: linux_amdgpu_clamped
  changed_when: false
  check_mode: false
  tags: [linux, power]

# A shell redirect rather than ansible.builtin.copy: this is a sysfs attribute,
# not a file. copy would try to manage ownership and mode on something that has
# neither in any meaningful sense, and writing via a temp file plus rename does
# not work on sysfs at all.
- name: Release the eGPU from the internal dGPU's power clamp
  ansible.builtin.shell:
    cmd: printf 'auto' > {{ item | quote }}
    executable: /bin/bash
  become: true
  loop: "{{ linux_amdgpu_clamped.stdout_lines }}"
  changed_when: true
  tags: [linux, power]
