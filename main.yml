---
- name: Configure development environment
  hosts: all
  roles:
    # Platform baselines are os_family-guarded: macOS hosts run `osx`
    # (Homebrew, macOS defaults), the migrated host runs `linux` (apt, sshd).
    # The remaining roles are cross-platform config; the Linux stabilization
    # loop (specs/linux-migration Task 7) drives their first Linux run clean.
    # `services` is the exception: it carries no `when:` here because its two
    # task files guard themselves, provisioning the declared dev-services
    # layer on Debian and the role's macOS-only content on Darwin.
    #
    # `user-config` marks the roles `scripts/playbook.sh --user-config` runs
    # unattended, with no sudo password. A new role joins it unless it
    # escalates by design; one that joins keeps each escalating task behind a
    # drift check or the `privileged` tag (docs/ansible-roles.md).
    - role: osx
      when: ansible_facts.os_family == "Darwin"
    - role: linux
      when: ansible_facts.os_family == "Debian"
    - role: kitty
      tags: [user-config]
    - role: fish
      tags: [user-config]
    - role: services
      tags: [user-config]
    - role: environments
      tags: [user-config]
    - role: tmux
      tags: [user-config]
    - role: ssh
      tags: [user-config]
    - role: git
      tags: [user-config]
    # Cross-platform, and deliberately NOT inside `osx`. Claude Code runs on
    # both platforms, but this config lived in the Darwin-guarded role, so the
    # Linux host had no ~/.claude/CLAUDE.md, no managed settings.json, and no
    # commands/ or scripts/ at all.
    - role: claude
      tags: [user-config]
