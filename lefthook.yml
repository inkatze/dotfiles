pre-commit:
  parallel: true
  commands:
    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint .
    ansible-lint:
      glob: "*.{yml,yaml}"
      run: ansible-lint
    syntax-check:
      glob: "*.{yml,yaml}"
      run: ansible-playbook main.yml --syntax-check
    gitleaks:
      run: gitleaks git --staged --no-banner --redact --config .gitleaks.toml
    shellcheck:
      # --severity=warning, not the default `style`, because the tracked
      # scripts carry info-level SC2015 notes (`A && B || C`) that are
      # deliberate and would block every commit. Warning-level is green today,
      # so this gate catches regressions instead of demanding a cleanup first.
      # Raise the bar by fixing the SC2015 notes and dropping the flag.
      glob: "*.sh"
      run: shellcheck --severity=warning {staged_files}
    skill-contracts:
      # Beyond the command files: CLAUDE.md is in the glob because the checker
      # asserts against it; the checker so its own edits re-run it; and the
      # fixture suite both so its edits are validated and because the suite is
      # the only thing that notices a check class being deleted from the
      # checker (the checker alone still reports "all invariants hold").
      glob: "roles/claude/files/{commands/*.md,CLAUDE.md,scripts/skill-contracts.sh,scripts/skill-contracts-test.sh}"
      run: roles/claude/files/scripts/skill-contracts.sh && roles/claude/files/scripts/skill-contracts-test.sh
    claude-settings-merge:
      # The suite is what notices a merge case being dropped; the script alone
      # would still report OK.
      glob: "{scripts/claude-settings-merge.sh,scripts/claude-settings-merge-test.sh,roles/claude/files/settings.json}"
      run: scripts/claude-settings-merge-test.sh
    credential-path-guard:
      # The suite is what notices the guard being dropped; the role alone still
      # converges and reports success while writing into a foreign credentials
      # file.
      glob: "{roles/environments/tasks/nodejs.yml,roles/services/tasks/darwin.yml,\
        scripts/credential-path-guard-test.sh}"
      run: scripts/credential-path-guard-test.sh
    git-unattended-auth:
      # The suite is what notices IdentitiesOnly being dropped; the role alone
      # still converges, and the host only stalls once its agent is locked.
      glob: "{roles/git/tasks/main.yml,roles/git/defaults/main.yml,\
        scripts/git-unattended-auth-test.sh}"
      run: scripts/git-unattended-auth-test.sh
    planwright-marketplace:
      # The suite is what notices the stale-source removal being dropped or
      # loosened; the role alone still converges on a host already migrated.
      glob: "{roles/claude/tasks/planwright.yml,roles/claude/defaults/main.yml,\
        scripts/planwright-marketplace-test.sh}"
      run: scripts/planwright-marketplace-test.sh
    fish-ssh-agent:
      # CI runs it only in the macOS fish job, so this is the Linux branch's gate.
      glob: "{roles/fish/files/fish/config.fish,scripts/fish-ssh-agent-test.sh}"
      run: scripts/fish-ssh-agent-test.sh
    fish-functions-ignore:
      # No glob, deliberately: the drift it catches is a plugin file sitting in
      # the working tree, which can be there with nothing in that directory
      # staged. A glob would run the check only on the commits that cannot have
      # the problem yet.
      #
      # Not in CI either: a fresh checkout has no untracked files, so the
      # assertion passes there by construction and would report coverage it
      # does not have.
      run: scripts/fish-functions-ignore-test.sh
    baseline-plaintext-guard:
      glob: "specs/metrics-baseline/snapshots/baseline-*"
      run: |
        pattern='^specs/metrics-baseline/snapshots/baseline-.*\.md$'
        plaintext=$(git diff --cached --name-only \
          | grep "$pattern" | grep -v '\-rough\.md$')
        if [ -n "$plaintext" ]; then
          echo "ERROR: refusing to commit plaintext baseline snapshot(s):"
          echo "$plaintext"
          echo "Encrypt with age -R specs/metrics-baseline/snapshots/recipients.txt"
          echo "and commit only baseline-*.md.age. See specs/metrics-baseline/snapshots/README.md."
          exit 1
        fi
