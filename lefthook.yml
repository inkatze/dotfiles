pre-commit:
  parallel: true
  commands:
    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint .
    ansible-lint:
      glob: "*.{yml,yaml}"
      run: ansible-lint
    syntax-check:
      glob: "*.{yml,yaml}"
      run: ansible-playbook main.yml --syntax-check
    gitleaks:
      run: gitleaks git --staged --no-banner --redact --config .gitleaks.toml
    shellcheck:
      # --severity=warning, not the default `style`, because the tracked
      # scripts carry info-level SC2015 notes (`A && B || C`) that are
      # deliberate and would block every commit. Warning-level is green today,
      # so this gate catches regressions instead of demanding a cleanup first.
      # Raise the bar by fixing the SC2015 notes and dropping the flag.
      glob: "*.sh"
      run: shellcheck --severity=warning {staged_files}
    skill-contracts:
      # Beyond the skill files: both CLAUDE.md files are in the glob because the
      # checker asserts against them, and the checker so its own edits re-run it.
      glob: "{CLAUDE.md,roles/claude/files/{skills/*/*.{md,json,tpl,jq},planwright/*.tpl,CLAUDE.md,\
        scripts/{skill-contracts.sh,skill-contracts-test.sh,identifier-check.sh}}}"
      run: roles/claude/files/scripts/skill-contracts.sh
    skill-contracts-suite:
      # The fixture suite is what notices a check class being deleted from the
      # checker (the checker alone still reports "all invariants hold"). It is
      # slow, so it runs here only when the checker, the suite or the
      # identifier check it runs changes; CI (.github/workflows/test.yml) runs
      # it on every PR.
      glob: "roles/claude/files/scripts/{skill-contracts.sh,skill-contracts-test.sh,identifier-check.sh}"
      run: roles/claude/files/scripts/skill-contracts-test.sh
    instruction-budget:
      # lefthook.yml and the workflow too: the suite asserts both wire the checker.
      # docs/ and claude-context too: the suite checks the root file's links and
      # the line ceiling that bundle sets.
      glob: "{CLAUDE.md,lefthook.yml,.github/workflows/test.yml,docs/*.md,\
        specs/claude-context/requirements.md,\
        roles/claude/files/{skills/*/*.md,CLAUDE.md,scripts/instruction-budget{.sh,-test.sh}}}"
      run: roles/claude/files/scripts/instruction-budget.sh && roles/claude/files/scripts/instruction-budget-test.sh
    claude-skills-link:
      # The suite is what notices the ownership guard being dropped; the role
      # alone still converges on a host whose skills directory holds nothing
      # foreign.
      glob: "{roles/claude/tasks/skills.yml,roles/claude/tasks/main.yml,scripts/claude-skills-link-test.sh}"
      run: scripts/claude-skills-link-test.sh
    claude-settings-merge:
      # The suite is what notices a merge case being dropped; the script alone
      # would still report OK.
      glob: "{scripts/claude-settings-merge.sh,scripts/claude-settings-merge-test.sh,roles/claude/files/settings.json}"
      run: scripts/claude-settings-merge-test.sh
    claude-statusline:
      # settings.json is in the glob because the suite also asserts the
      # statusLine wiring there; a broken one leaves the line blank, not red.
      glob: "{roles/claude/files/scripts/statusline.sh,roles/claude/files/settings.json,\
        scripts/claude-statusline-test.sh}"
      run: scripts/claude-statusline-test.sh
    credential-path-guard:
      # The suite is what notices the guard being dropped; the role alone still
      # converges and reports success while writing into a foreign credentials
      # file.
      glob: "{roles/environments/tasks/nodejs.yml,roles/services/tasks/darwin.yml,\
        scripts/credential-path-guard-test.sh}"
      run: scripts/credential-path-guard-test.sh
    git-unattended-auth:
      # The suite is what notices IdentitiesOnly being dropped; the role alone
      # still converges, and the host only stalls once its agent is locked.
      glob: "{roles/git/tasks/main.yml,roles/git/defaults/main.yml,\
        scripts/git-unattended-auth-test.sh}"
      run: scripts/git-unattended-auth-test.sh
    planwright-marketplace:
      # The suite is what notices the stale-source removal being dropped or
      # loosened; the role alone still converges on a host already migrated.
      glob: "{roles/claude/tasks/planwright.yml,roles/claude/defaults/main.yml,\
        scripts/planwright-marketplace-test.sh}"
      run: scripts/planwright-marketplace-test.sh
    playbook-alias:
      # The suite is what notices the empty-alias guard being dropped; the
      # script alone still runs, just against every inventory host.
      glob: "{scripts/playbook.sh,scripts/playbook-alias-test.sh}"
      run: scripts/playbook-alias-test.sh
    op-token:
      # The suite is what notices a token guard being dropped from the shared
      # helper; both sync scripts still run and hand op whatever they read.
      glob: "{scripts/op-token.sh,scripts/op-token-test.sh,\
        scripts/claude-gemini-auth-sync.sh,scripts/ssh-lan-config-sync.sh}"
      run: scripts/op-token-test.sh
    op-render:
      # The suite is what notices a guard being dropped from the renderer; the
      # renderer alone still writes a file, just one nothing checked.
      glob: "{scripts/op-render.sh,scripts/op-render-test.sh,scripts/op-token.sh,\
        roles/claude/files/skills/*/*.{tpl,jq},roles/claude/files/planwright/*.tpl}"
      run: scripts/op-render-test.sh
    op-key-sync:
      # The suite is what notices a mode or blank-value guard being dropped;
      # the script alone still writes a key file, just one nothing checked.
      glob: "{scripts/op-key-sync.sh,scripts/op-key-sync-test.sh,scripts/op-token.sh}"
      run: scripts/op-key-sync-test.sh
    reviewer-backend:
      # The template is in the glob because the suite runs the cubic entry's
      # own cli block through the snippet.
      glob: "{roles/claude/files/skills/panel-review/reviewer-backend.md,\
        roles/claude/files/skills/bot-review/bot-review.json.tpl,\
        roles/claude/files/scripts/reviewer-backend-test.sh}"
      run: roles/claude/files/scripts/reviewer-backend-test.sh
    cubic-postinstall-optout:
      # Needs the network: it fetches the pinned package to read its
      # postinstall. A version bump fails it until the new script is reviewed.
      glob: "{roles/environments/files/mise.toml,roles/environments/tasks/main.yml,\
        scripts/cubic-postinstall-optout-test.sh}"
      run: scripts/cubic-postinstall-optout-test.sh
    fish-tower:
      # The suite is what notices the launcher losing its fail-closed refusal;
      # the function alone still starts a tower, just without its deny floor.
      glob: "{roles/fish/files/planwright.fish,roles/fish/files/fish/functions/{tower,claude}.fish,\
        scripts/fish-tower-test.sh}"
      run: scripts/fish-tower-test.sh
    fish-functions-ignore:
      # No glob, deliberately: the drift it catches is a plugin file sitting in
      # the working tree, which can be there with nothing in that directory
      # staged. A glob would run the check only on the commits that cannot have
      # the problem yet.
      #
      # Not in CI either: a fresh checkout has no untracked files, so the
      # assertion passes there by construction and would report coverage it
      # does not have.
      run: scripts/fish-functions-ignore-test.sh
    baseline-plaintext-guard:
      glob: "specs/metrics-baseline/snapshots/baseline-*"
      run: |
        pattern='^specs/metrics-baseline/snapshots/baseline-.*\.md$'
        plaintext=$(git diff --cached --name-only \
          | grep "$pattern" | grep -v '\-rough\.md$')
        if [ -n "$plaintext" ]; then
          echo "ERROR: refusing to commit plaintext baseline snapshot(s):"
          echo "$plaintext"
          echo "Encrypt with age -R specs/metrics-baseline/snapshots/recipients.txt"
          echo "and commit only baseline-*.md.age. See specs/metrics-baseline/snapshots/README.md."
          exit 1
        fi
